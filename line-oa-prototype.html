<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>อิ่มต่อ LoopLard Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: guide rail | LINE phone | live backend log — or a full-width owner dashboard */
:root{
  --bg:#edf2ee; --surface:#ffffff; --surface-2:#f5f8f5; --ink:#13241a; --muted:#5b6d61; --line:#d6e1d8;
  --accent:#06c755; --accent-ink:#047a35; --accent-soft:#dff5e7;
  --warn:#d98a00; --warn-soft:#fff2d9; --bad:#d8434a; --cold:#2a83c9; --cold-soft:#e3f0fb;
  --s-a:#1f9d55; --s-b:#e0a00a; --s-c:#9aa59e; --s-fert:#c07a2c; --s-gas:#b6532f;
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-line:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Thonburi","Noto Sans Thai",sans-serif;
  /* phone stays in LINE's own light look in both themes */
  --l-green:#06c755; --l-chat:#8cabd9; --l-me:#8de055; --l-ink:#111; --l-bar:#ffffff; --l-link:#42659a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1410; --surface:#141f19; --surface-2:#1a271f; --ink:#e4eee7; --muted:#93a79a; --line:#26372d;
  --accent:#2bd36f; --accent-ink:#5be393; --accent-soft:#163a25; --warn:#f0b13a; --warn-soft:#3a2c10;
  --bad:#f0686e; --cold:#5aa9e6; --cold-soft:#12293b;
  --s-a:#3cc177; --s-b:#eeb534; --s-c:#6f7d74; --s-fert:#e09a4e; --s-gas:#e07c58; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1410; --surface:#141f19; --surface-2:#1a271f; --ink:#e4eee7; --muted:#93a79a; --line:#26372d;
  --accent:#2bd36f; --accent-ink:#5be393; --accent-soft:#163a25; --warn:#f0b13a; --warn-soft:#3a2c10;
  --bad:#f0686e; --cold:#5aa9e6; --cold-soft:#12293b;
  --s-a:#3cc177; --s-b:#eeb534; --s-c:#6f7d74; --s-fert:#e09a4e; --s-gas:#e07c58; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sm{display:none}

/* top bar */
.top{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:700 20px/1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;position:relative}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px var(--f-mono);text-align:center}

/* stage */
.stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(250px,310px) auto minmax(230px,290px);gap:28px;justify-content:center;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.panel h3{margin:0 0 4px;font:600 15px/1.3 var(--f-display)}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.clock{display:flex;align-items:baseline;gap:10px;margin:8px 0 12px}
.clock .num{font-size:34px;font-weight:600;letter-spacing:-.02em}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface-2);padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.steps li:first-child{border-top:0}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font:600 12px/24px var(--f-mono);text-align:center}
.steps p{margin:0;font-size:13.5px;line-height:1.5}
.steps p em{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.steps .try{margin-top:6px;border:0;background:none;padding:0;color:var(--accent-ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
details.panel summary{cursor:pointer;font:600 14px/1.3 var(--f-display);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.panel summary::-webkit-details-marker{display:none}
details.panel pre{font:11.5px/1.5 var(--f-mono);max-height:300px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);padding:10px;border-radius:10px;margin:12px 0 0;white-space:pre;color:var(--ink)}

/* loop strip: the Loop lard diagram, lit by what just happened */
.loop{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.loop .n{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;transition:background .4s,border-color .4s}
.loop .n.on{background:var(--accent-soft);border-color:var(--accent)}
.loop .n.off{opacity:.45}
.loop .n b{font-weight:600}
.loop .n small{display:block;color:var(--muted);font-size:11.5px}
.loop .n .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}

.log{display:flex;flex-direction:column;max-height:520px;overflow:auto;margin:0 -6px;padding:0 6px}
.log .e{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.8px;animation:fadein .4s ease;min-width:0}
.log .e>span{min-width:0;overflow-wrap:anywhere}
.log .e:first-child{border-top:0}
.log .e .num{color:var(--muted);font-size:11.5px;padding-top:2px}
.log .tag{display:inline-block;font:600 10.5px/1 var(--f-mono);padding:3px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;background:var(--surface-2);color:var(--muted)}
.log .ok .tag{background:var(--accent-soft);color:var(--accent-ink)}
.log .warn .tag{background:var(--warn-soft);color:var(--warn)}
.log .cold .tag{background:var(--cold-soft);color:var(--cold)}
.log .api .tag{background:var(--ink);color:var(--bg)}
.log .api{color:var(--muted)}

.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.shot{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px 20px}
.shot .cap{font:600 14px var(--f-display);color:var(--muted)}

/* ---------- phone (LINE, reverse-engineered) ---------- */
.phone{width:384px;max-width:100%;height:800px;border-radius:52px;background:#0f1411;padding:11px;box-shadow:0 30px 60px -20px rgba(10,30,20,.45),0 0 0 1px rgba(0,0,0,.08);position:relative}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--l-chat);display:flex;flex-direction:column;position:relative;font-family:var(--f-line);color:var(--l-ink);isolation:isolate}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:#000;z-index:30}
.status{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 34px;font:600 14.5px/1 var(--f-line);background:var(--l-bar)}
.status .ic{display:flex;gap:5px;align-items:center}
.chathead{flex:none;display:flex;align-items:center;gap:4px;padding:4px 8px 9px;background:var(--l-bar)}
.chathead .t{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.chathead .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chathead button{border:0;background:none;padding:5px;color:#111;display:grid;place-items:center}
.msgs{flex:1;overflow-y:auto;padding:10px 12px 10px 8px;display:flex;flex-direction:column;gap:6px}
.msgs::-webkit-scrollbar{width:0}
.datechip{align-self:center;background:rgba(0,0,0,.16);color:#fff;font-size:12px;padding:3px 11px;border-radius:12px;margin:4px 0}
.row{display:flex;gap:8px;align-items:flex-start;animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
.row.first{margin-top:6px}
.row.me{flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center}
.who{font-size:12px;color:#1c2738;margin:0 0 4px 2px}
.bwrap{display:flex;align-items:flex-end;gap:5px}
.row.me .bwrap{flex-direction:row-reverse}
.meta{font-size:10px;color:#2c3a50;opacity:.8;line-height:1.25;white-space:nowrap;text-align:right;padding-bottom:1px}
.row:not(.me) .meta{text-align:left}
.bubble{background:#fff;border-radius:19px;padding:8px 13px;font-size:15px;line-height:1.42;white-space:pre-wrap;word-break:break-word;position:relative;max-width:232px}
.row.me .bubble{background:var(--l-me)}
.row.first .bubble::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:14px;background:inherit;clip-path:path('M14 0H3C1 0 0 1.6 1.7 3.1C5 6.2 7.4 9.6 8.8 14H14Z')}
.row.me.first .bubble::before{left:auto;right:-6px;clip-path:path('M0 0H11C13 0 14 1.6 12.3 3.1C9 6.2 6.6 9.6 5.2 14H0Z')}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#a3abb6;animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

/* Flex Message */
.fx{width:264px;background:#fff;border-radius:17px;overflow:hidden}
.fx .bd{padding:14px 16px 8px;display:flex;flex-direction:column;gap:6px}
.fx .ttl{font-weight:700;font-size:17px;line-height:1.25}
.fx .kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#666}
.fx .kv b{color:#111;font-weight:600;text-align:right}
.fx .big{font-size:30px;font-weight:700;line-height:1.1;color:#111}
.fx .note{font-size:12.5px;color:#666;background:#f5f6f7;border-radius:8px;padding:7px 9px;line-height:1.45}
.fx .note.warn{background:#fff4e0;color:#8a5a00}
.fx .ft{padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
.fx .hd{padding:12px 16px;color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.fx .hero{height:104px;position:relative;display:grid;place-items:center;overflow:hidden}
.fbtn{border:0;border-radius:8px;height:42px;padding:0 10px;font-weight:500;font-size:15px;background:transparent;color:var(--l-link);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s}
.fbtn:hover{background:#f4f6f9}
.fbtn:active{transform:scale(.98)}
.fbtn.p{background:var(--l-green);color:#fff;font-weight:600}
.fbtn.c{background:#2a83c9;color:#fff;font-weight:600}
.fbtn.o{background:#c07a2c;color:#fff;font-weight:600}
.fbtn[disabled]{opacity:.35;cursor:default}
.fbtn.chosen{opacity:1;background:#eef9f2;color:#0a7d39;font-weight:600}
.code{font:700 28px/1 var(--f-mono);letter-spacing:.12em;text-align:center;color:#111}
.mini{display:flex;flex-direction:column}
.mini .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef0f2;font-size:13px}
.mini .it:first-child{border-top:0}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.gchip{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 13px var(--f-mono);flex:none}
.meter{height:8px;border-radius:4px;background:#eceff2;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}

/* quick reply */
.qr{flex:none;display:flex;gap:8px;overflow-x:auto;padding:6px 10px 8px;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr button{flex:none;border:0;background:#fff;color:#111;border-radius:999px;padding:7px 14px;font:500 14px var(--f-line);display:flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.2);animation:pop .3s ease}
.qr button svg{color:#06c755}

/* bottom bar */
.bar{flex:none;background:#fff;display:flex;align-items:center;gap:2px;padding:6px 6px calc(6px + 16px);border-top:1px solid #e6e6e6}
.bar .ib{border:0;background:none;width:36px;height:36px;padding:0;color:#2b2b2b;display:grid;place-items:center;border-radius:8px;flex:none}
.bar .ib:hover{background:#f2f3f5}
.field{flex:1;min-width:0;display:flex;align-items:center;background:#f2f2f2;border-radius:18px;padding:0 4px 0 13px;height:36px}
.field input{flex:1;min-width:0;width:0;border:0;background:transparent;font:15px var(--f-line);color:#111;outline:none;padding:0}
.field input::placeholder{color:#a5a5a5}
.field button{border:0;background:none;padding:4px;color:#8a8a8a;display:grid;place-items:center}
.send{color:var(--l-green)!important}
.menuToggle{flex:1;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:5px;font:600 14.5px var(--f-line);color:#111;height:36px}

/* rich menu = one 2500x1686 image + invisible tap areas (LINE Messaging API format) */
.rich{flex:none;max-height:0;overflow:hidden;background:#fff;transition:max-height .32s cubic-bezier(.3,.8,.3,1)}
.rich.open{max-height:320px}
.rimg{position:relative;aspect-ratio:2500/1686;max-width:100%}
.rimg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rimg .area{position:absolute;border:0;background:transparent;padding:0;transition:background .12s}
.rimg .area:active{background:rgba(0,0,0,.1)}
.rimg .area:focus-visible{outline:3px solid #06c755;outline-offset:-3px}

/* LIFF */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:fadein .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;height:88%;background:#f6f7f9;border-radius:12px 12px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .36s cubic-bezier(.2,.9,.25,1);overflow:hidden}
.sheet .sh{flex:none;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:8px 6px;background:#fff;border-bottom:1px solid #ececec}
.sheet .sh .t{text-align:center;min-width:0}
.sheet .sh .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh .t small{color:#999;font-size:11px}
.sheet .sh button{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#222}
.sheet .sb{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.sheet .sb::-webkit-scrollbar{width:0}
.card{background:#fff;border-radius:14px;padding:14px}
.lbl{font-size:12px;color:#6b7280;font-weight:500}
.bign{font-size:28px;font-weight:700;line-height:1.1}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:#eef0f3;font-size:19px;font-weight:600}
.stepper .v{min-width:30px;text-align:center;font:700 19px var(--f-mono)}
.cta{border:0;border-radius:12px;padding:14px;background:var(--l-green);color:#fff;font-weight:700;font-size:16px;width:100%}
.cta[disabled]{background:#c5cad1}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1.5px solid #dfe3e8;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#374151}
.pills button[aria-pressed="true"]{border-color:#06c755;background:#eafaf0;color:#0a7d39}
.ritem{display:grid;grid-template-columns:48px 1fr;gap:12px;background:#fff;border-radius:14px;padding:12px;align-items:start}
.ritem .ri{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.ritem.off{opacity:.5}
.ritem .row2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.viewfinder{aspect-ratio:1/1;max-width:100%;border-radius:20px;background:radial-gradient(circle at 50% 40%,#3a4a3f,#141a16);position:relative;overflow:hidden;display:grid;place-items:center}
.viewfinder .corner{position:absolute;width:40px;height:40px;border:4px solid #06c755}
.viewfinder .scanline{position:absolute;left:12%;right:12%;height:3px;background:linear-gradient(90deg,transparent,#5cff9d,transparent);box-shadow:0 0 18px #5cff9d;animation:scan 1.6s ease-in-out infinite alternate}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{border:0;background:#fff;border-radius:14px;padding:12px 0;font:600 21px var(--f-mono)}
.keypad button:active{background:#e6f9ee}
.grade{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border:2px solid #e5e8ec;background:#fff;border-radius:16px;padding:12px;text-align:left;width:100%}
.grade[aria-pressed="true"]{border-color:#06c755;background:#f0fcf4}
.grade .g{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 26px var(--f-mono);color:#fff}
.burst{animation:burst .7s cubic-bezier(.2,1.4,.4,1)}

/* ---------- dashboard ---------- */
.dash{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px}
.dhead h1{font:700 clamp(24px,3vw,32px)/1.15 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.dhead p{margin:4px 0 0;color:var(--muted)}
.dhead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.notice{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:9px 14px}
.mods{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mod{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:600}
.mod[aria-pressed="false"]{opacity:.55}
.mod .sw{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .2s;flex:none}
.mod .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.mod[aria-pressed="true"] .sw{background:var(--accent)}
.mod[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font:600 28px/1.1 var(--f-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font:500 14px var(--f-body);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .l{font-size:13px;font-weight:600}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .pill{align-self:flex-start;font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:6px;margin-top:4px}
.pill.good{background:var(--accent-soft);color:var(--accent-ink)}
.pill.meh{background:var(--warn-soft);color:var(--warn)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}

.co2 .r{display:grid;grid-template-columns:minmax(0,1fr) 150px 52px;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid var(--line)}

.co2 .r.off{opacity:.4}
.co2 .track{height:12px;position:relative}
.co2 .track i{position:absolute;top:0;height:100%;border-radius:3px}
.co2 .tot{font-weight:600}

.flow{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

.flowgrid .simbox canvas{height:min(44vw,560px);min-height:320px}
.sim.embed{gap:10px}
.sim.embed .simctl .mod{padding:7px 10px;font-size:12.5px}
.scene{cursor:pointer;transition:border-color .2s,box-shadow .2s}
.scene.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scene .acts{display:flex;flex-wrap:wrap;gap:8px}
.scene .acts:empty{display:none}
@media (max-width:980px){ .flowgrid{grid-template-columns:minmax(0,1fr)} .flowgrid .stick{position:static} .flowgrid .simbox canvas{height:min(70vw,520px)} }
@media (max-width:700px){ .flowgrid .simbox canvas{height:78vw;min-height:280px} }
.flow h1{font:700 clamp(26px,3.4vw,38px)/1.15 var(--f-display);margin:6px 0 6px;letter-spacing:-.015em;text-wrap:balance}
.flow .lede{color:var(--muted);margin:0;max-width:62ch}
.flow h2{font:700 20px/1.3 var(--f-display);margin:0 0 4px}
.story{position:relative;padding-left:58px;display:flex;flex-direction:column;gap:14px}
.story::before{content:"";position:absolute;left:19px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.scene{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scene .dot{position:absolute;left:-58px;top:14px;width:40px;height:40px;border-radius:13px;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg)}
.scene .top2{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.scene .when{font:600 12px var(--f-mono);color:var(--muted)}
.scene .who2{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff}
.scene h3{margin:0;font:600 16.5px/1.35 var(--f-display)}
.scene p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.scene .pts{display:inline-flex;align-items:baseline;gap:4px;font:700 22px var(--f-mono);color:var(--accent-ink)}
.branch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.branch>div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.branch b{color:var(--ink);font-size:14px;display:flex;align-items:center;gap:6px}
.pflow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pflow .nd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.pflow .ar{color:var(--muted)}
.gets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gets>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}

.sim{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sim .head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px}

.clk{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#13241a;border-radius:10px;padding:6px 10px;font:600 12px var(--f-mono)}

function QR({ seed = 'A', size = 104 }) {
  const n = 25; let h = 2166136261; for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }

      if (dx >= -1 && dx <= 7 && dy >= -1 && dy <= 7) { if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return 0;
        return (dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)) ? 1 : 0; } } return -1; };
  let d = ''; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const f = fin(x, y); if (f === 1 || (f === -1 && rnd() > 0.52)) d += `M${x} ${y}h1v1h-1z`; }
  return html`<svg viewBox=${`-2 -2 ${n + 4} ${n + 4}`} width=${size} height=${size} style=${{ background: '#fff', borderRadius: 8 }} aria-label="QR code"><path d=${d} fill="#111" /></svg>`;
}

          <div className="kv"><span>เกรด</span><b style=${{ color: g.col }}>${c.grade} · ${g.name}</b></div>
          <div className="kv"><span>คนขน</span><b>${ME.porter.name}</b></div>
          <div className="kv"><span>แต้มคงเหลือ</span><b className="num">${nf(s.points.vendor)}</b></div>

          <${Goal} bal=${s.points.vendor} /></div>
        <${Btns} m=${m} role=${role} items=${zero ? [{ label: 'ดูวิธีแยกเศษ', a: 'howto', keep: true }] : [{ label: 'แลกแต้ม', a: 'redeem-open', cls: 'p', keep: true }]} /></div>`;

        <div className="bd"><div className="mini">${mine.map((p, k) => html`<div key=${k} className="it"><span className="gchip" style=${{ background: GRADES[p.grade].col }}>${p.grade}</span><div style=${{ flex: 1 }}><b className="num">${p.kg} กก.</b><div style=${{ fontSize: 12, color: '#888' }}>${hm(p.t)} · ${ME.porter.name}</div></div><b className="num" style=${{ color: p.pts ? '#0a8a3e' : '#999' }}>+${p.pts}</b></div>`)}</div>

    case 'howto': return html`<div className="fx"><${Head} bg=${G.teal} i="help">วิธีแยกเศษให้ได้เกรด A<//>

      const j = s.jobs.find(z => z.id === c.jid); if (!j) return null;

    case 'receipt': {

        <div className="bd"><div className="kv"><span>ร้าน</span><b>${c.shop} · ${c.stall}</b></div><div className="kv"><span>น้ำหนัก</span><b className="num">${c.kg} กก.</b></div>

        <div className="bd"><div className="mini">${list.length ? list.map(z => html`<div key=${z.id} className="it"><div style=${{ flex: 1 }}><b>${z.card.who}</b><div style=${{ fontSize: 12, color: '#888' }}>"${z.card.text}"</div></div><span className="chip" style=${{ background: z.done ? '#e3f8ea' : '#fff1dc', color: z.done ? '#0a7d39' : '#b86e00' }}>${z.done ? 'รับแล้ว' : 'รอรับ'}</span></div>`) : html`<div className="it" style=${{ color: '#888' }}>ยังไม่มีเรื่องค้าง</div>`}</div></div><div style=${{ height: 6 }}></div></div>`;
    }
    case 'digester': {
      const d = s.digester; const ok = d.ph >= 6.8 && d.ph <= 7.6;
      return html`<div className="fx"><${Head} bg=${G.teal} i="tank">สถานะบ่อหมักไบโอแก๊ส<//>
        <div className="bd"><div className="kv"><span>pH</span><b className="num" style=${{ color: ok ? '#0a8a3e' : '#b86e00' }}>${d.ph} · ${ok ? 'ปกติ' : 'ระวังบ่อเปรี้ยว'}</b></div>

          <div className="kv"><span>เศษเข้าบ่อวันนี้</span><b className="num">${nf(sum(s.pickups.filter(p => p.grade !== 'C'), p => p.kg), 1)} กก.</b></div>

// ข้อมูลจำลอง 14 วันของ pilot 1 โซน · สัดส่วนเกรด A ขยับจาก ~62% ไปเกิน 80% ในสัปดาห์ที่ 2
const BASE_DAYS = (() => Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - 13 + i);
  const tot = Math.round((380 + i * 10 + (i % 3) * 18) * (i === 13 ? 0.6 : 1)); const ra = 0.64 + i * 0.018 + (i % 2) * 0.01; const rc = Math.max(0.03, 0.14 - i * 0.008);
  const A = Math.round(tot * ra), C = Math.round(tot * rc);
  return { label: `${d.getDate()}/${d.getMonth() + 1}`, today: i === 13, A, B: tot - A - C, C }; }))();
const SHOPS = [['ป้าแดง', 'B12', 86, 88, 412, 300], ['เจ๊หมวย', 'A07', 92, 84, 438, 250], ['ลุงชัย', 'C03', 101, 71, 395, 100], ['พี่นก', 'B04', 64, 66, 236, 50], ['ป้าสมร', 'D11', 58, 79, 251, 200]];
const SER = [['A', 'เกรด A', '--s-a'], ['B', 'เกรด B', '--s-b'], ['C', 'เกรด C (ไม่เข้าบ่อ)', '--s-c']];
const tot3 = d => d.A + d.B + d.C;
const energy = d => (d.A + d.B) * BIO.yield * (1 - BIO.gasShare) * BIO.kwhPerM3;

function StackBars({ days }) {
  const W = 660, H = 250, l = 40, r = 8, t = 10, b = 26;
  const max = Math.ceil(Math.max(...days.map(tot3)) / 100) * 100; const bw = (W - l - r) / days.length; const y = v => t + (H - t - b) * (1 - v / max);
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="กราฟแท่ง กิโลกรัมเศษที่รับต่อวัน แยกตามเกรด">
    ${[0, .25, .5, .75, 1].map(f => html`<g key=${f}><line x1=${l} x2=${W - r} y1=${y(max * f)} y2=${y(max * f)} stroke="var(--line)" strokeDasharray=${f ? '3 4' : ''} /><text x=${l - 8} y=${y(max * f) + 4} textAnchor="end">${max * f}</text></g>`)}
    ${days.map((d, i) => { let acc = 0; const x = l + i * bw + bw * .18, w = bw * .64;
      return html`<g key=${i}>${SER.map(([k, name, c]) => { const v = d[k]; const y0 = y(acc + v), h = y(acc) - y(acc + v); acc += v;
        return html`<rect key=${k} x=${x} y=${y0} width=${w} height=${Math.max(0, h - 1)} rx="2" fill=${`var(${c})`}><title>${d.label} · ${name} ${v} กก.</title></rect>`; })}
        ${d.today && html`<rect x=${x - 3} y=${y(tot3(d)) - 3} width=${w + 6} height=${y(0) - y(tot3(d)) + 3} rx="4" fill="none" stroke="var(--ink)" strokeDasharray="3 3" />`}
        ${(i % 2 === 1 || d.today) && html`<text x=${x + w / 2} y=${H - 8} textAnchor="middle" style=${d.today ? { fill: 'var(--ink)', fontWeight: 600 } : null}>${d.today ? 'วันนี้' : d.label}</text>`}</g>`; })}</svg>`;
}
function EnergyLine({ days, need }) {
  const W = 420, H = 190, l = 34, r = 12, t = 12, b = 24; const pts = days.filter(d => !d.today).map(energy);
  const max = Math.ceil(Math.max(need, ...pts) / 10) * 10 + 10;
  const x = i => l + i * (W - l - r) / (pts.length - 1), y = v => t + (H - t - b) * (1 - v / max);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i)} ${y(v)}`).join(''); const area = line + `L${x(pts.length - 1)} ${y(0)}L${x(0)} ${y(0)}Z`;
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="ไฟที่ผลิตจากไบโอแก๊สเทียบไฟที่ห้องเย็นใช้">
    ${[0, max / 2, max].map(v => html`<g key=${v}><line x1=${l} x2=${W - r} y1=${y(v)} y2=${y(v)} stroke="var(--line)" strokeDasharray=${v ? '3 4' : ''} /><text x=${l - 6} y=${y(v) + 4} textAnchor="end">${v}</text></g>`)}
    ${need > 0 && html`<line x1=${l} x2=${W - r} y1=${y(need)} y2=${y(need)} stroke="var(--cold)" strokeDasharray="5 4" strokeWidth="1.5" /><text x=${W - r} y=${y(need) - 5} textAnchor="end" style=${{ fill: 'var(--cold)' }}>ห้องเย็นใช้ ${need} kWh</text>`}
    <path d=${area} fill="var(--accent)" opacity=".14" /><path d=${line} fill="none" stroke="var(--accent)" strokeWidth="2.4" strokeLinejoin="round" />
    <circle cx=${x(pts.length - 1)} cy=${y(pts[pts.length - 1])} r="5" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2.5" />
    <text x=${x(pts.length - 1) - 8} y=${y(pts[pts.length - 1]) + 18} textAnchor="end" style=${{ fill: 'var(--ink)', fontWeight: 600 }}>${nf(pts[pts.length - 1], 1)} kWh</text>
    <text x=${l} y=${H - 6}>${days[0].label}</text><text x=${W - r} y=${H - 6} textAnchor="end">เมื่อวาน</text></svg>`;
}

// เศรษฐศาสตร์แต้ม (เห็นเฉพาะเจ้าของตลาด): แต้มดูเยอะสำหรับแม่ค้า แต่ต้นทุนจริงต่อ กก. ต่ำกว่ามูลค่าที่ตลาดได้
function PointEcon({ days, rate, revenue, kgLoop, s }) {
  const kgA = days.reduce((a, d) => a + d.A, 0), kgB = days.reduce((a, d) => a + d.B, 0);
  const issued = kgA * GRADES.A.pts + kgB * GRADES.B.pts + (kgA + kgB) * GRADES.A.porter;
  const shopShare = 0.35, expire = 0.15; // สมมติฐาน pilot: ใช้ที่ร้านอื่น 35% · หมดอายุ 15%
  const value = kgLoop / 1000 * rate + revenue; const worst = issued * PT_BAHT; const expect = issued * (1 - shopShare - expire) * PT_BAHT;
  const perKgV = value / kgLoop, perKgC = worst / kgLoop;
  const rows = [
    ['มูลค่าที่ตลาดได้ (ค่าฝังกลบที่ไม่ต้องจ่าย + ขายปุ๋ย/แก๊ส)', '฿' + nf(value), 'var(--accent)', 100],
    ['ต้นทุนแต้ม ถ้าทุกแต้มมาแลกบริการตลาด (กรณีแย่สุด)', '฿' + nf(worst), 'var(--warn)', worst / value * 100],
    [`ต้นทุนที่คาด (ใช้ที่ร้านอื่น ${shopShare * 100}% · หมดอายุ ${expire * 100}%)`, '฿' + nf(expect), 'var(--cold)', expect / value * 100],
  ];
  return html`<div className="grid2">
    <div className="panel"><h3>แต้มไม่ทำให้ตลาดขาดทุน</h3><p className="sub">14 วัน · แจกไป ${nf(issued)} แต้ม · เห็นเฉพาะเจ้าของตลาด</p>
      <div className="co2">${rows.map(([t, v, c, w]) => html`<div key=${t} className="r"><span>${t}</span><span className="track"><i style=${{ left: 0, width: Math.min(100, w) + '%', background: c }}></i></span><b className="num" style=${{ textAlign: 'right', fontSize: 12 }}>${v}</b></div>`)}</div>
      <div className="mods" style=${{ marginTop: 12 }}><span className="pill good" style=${{ font: '600 12px/1 var(--f-mono)', padding: '6px 9px', borderRadius: 8 }}>ต่อ กก. ตลาดได้ ฿${perKgV.toFixed(2)} · จ่ายแต้มไม่เกิน ฿${perKgC.toFixed(2)}</span>
        <span className=${'pill ' + (worst <= value * 0.4 ? 'good' : 'meh')} style=${{ font: '600 12px/1 var(--f-mono)', padding: '6px 9px', borderRadius: 8 }}>เพดานแต้ม ≤ 40% ของมูลค่า</span></div></div>

  if (ph >= 26 && ph < 29.5) { // coin circulates to another stall
    const k = ease((ph - 26) / 2.2); const a = P(7.2, 1.8, 2.6), b = P(12.4, 1.8, 2.6); const x = lerp(a[0], b[0], k), y = lerp(a[1], b[1], k) - Math.sin(k * Math.PI) * 60 * sc;
    if (k < 1) { ctx.fillStyle = '#f2b705'; ctx.beginPath(); ctx.arc(x, y, 8 * sc, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = font(10, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('฿', x, y + 1); }
    if (ph >= 28.2) label('+1,000 แต้มเข้าร้านเจ๊นิด', 12.4, 1.8, 3.0, { size: 11, bg: '#f2b705', color: '#fff' });
    if (mods.cold && ph < 27.6) label('ใช้ 1,500 แต้ม · ฝากฟรี 1 ลัง', 7.9, 3.0, 2.1, { size: 11, bg: '#2a83c9', color: '#fff' });
  }
  if (mods.cold && ph >= 29) label('✓ จนท.สแกน · เข้าห้องเย็นแล้ว', 11.2, 7.6, 2.0, { size: 11, bg: '#6f5bd0', color: '#fff' });
}

// ช่วงเวลาในรอบ 30 วิ ที่ตรงกับแต่ละขั้นของ Workflow (ขั้น 8–9 ไม่มีฉากเฉพาะ)
const SCENE_PH = [0, 5, 7, 14, 18, 26, 29, 0, null];
const sceneOf = ph => ph < 5 ? 0 : ph < 7 ? 1 : ph < 14 ? 2 : ph < 18 ? 3 : ph < 26 ? 4 : ph < 29 ? 5 : 6;

function MarketSim({ s, embed, seekRef, onPhase }) {
  const cv = useRef(null), box = useRef(null);
  const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [play, setPlay] = useState(!reduce), [speed, setSpeed] = useState(1), [hud, setHud] = useState(0);
  const S = useRef({ t: 0, last: 0, hu: 0 }); const live = useRef({}); live.current = { play, speed, mods: s.modules };
  useEffect(() => { let raf; const loop = now => { const st = S.current; const dt = st.last ? Math.min(.05, (now - st.last) / 1000) : 0; st.last = now;
      if (live.current.play) st.t += dt * live.current.speed; drawSim(cv.current, st.t, live.current.mods);
      if (now - st.hu > 150) { st.hu = now; setHud(st.t); live.current.onPhase?.(st.t % LOOP_S); } raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(raf); }, []);
  live.current.onPhase = onPhase;
  if (seekRef) seekRef.current = ph => { const st = S.current; st.t = (Math.floor(st.t / LOOP_S) + (ph < st.t % LOOP_S ? 1 : 0)) * LOOP_S + ph + 0.01; setHud(st.t); setPlay(true); };
  const mods = s.modules; const ph = hud % LOOP_S; const hours = hud / LOOP_S; const [step, cap] = simCap(ph, mods);
  const kg = hours * 42, ab = kg * .88, m3 = ab * BIO.yield, kwh = mods.cold ? m3 * (1 - BIO.gasShare) * BIO.kwhPerM3 : 0, co2 = ab * co2PerKg(mods), pts = ab * 92;
  const circ = Math.floor(hours) * 1000 + (ph >= 28.2 ? 1000 : 0);
  const clock = 6 * 60 + Math.floor(hours * 60); const hh = String(Math.floor(clock / 60) % 24).padStart(2, '0'), mm = String(clock % 60).padStart(2, '0');
  const toggle = k => D(x => addLog({ ...x, modules: { ...x.modules, [k]: !x.modules[k] } }, `${x.modules[k] ? 'ปิด' : 'เปิด'} ${MODS[k].n}`, ''));
  const full = () => { const el = box.current; if (!el) return; if (document.fullscreenElement) document.exitFullscreen?.(); else el.requestFullscreen?.().catch(() => toast('เบราว์เซอร์นี้เปิดเต็มจอไม่ได้')); };
  return html`<div className=${'sim' + (embed ? ' embed' : '')}>
    ${!embed && html`<div className="head"><div><div className="eyebrow">จำลองตลาด · 1 รอบ = 30 วินาที</div><h1>LoopLard ทำงานในตลาดจริงยังไง</h1>
      <p>ตามถังของป้าแดง ดูเศษผักกลายเป็นแต้ม ไบโอแก๊ส ความเย็น ปุ๋ย และแก๊สหุงต้ม · ตัวเลขเป็นข้อมูลจำลอง</p></div></div>`}
    <div className="simbox" ref=${box}>
      <canvas ref=${cv} role="img" aria-label=${'ภาพจำลองตลาด ขั้นที่ ' + step + ': ' + cap}></canvas>
      <div className="clk">${hh}:${mm} น. · รอบที่ ${Math.floor(hours) + 1}</div>
      <div className="ctr">
        <div>เศษเข้าลูป<b>${nf(kg, 1)} กก.</b></div><div>ไบโอแก๊ส<b>${nf(m3, 2)} m³</b></div><div>ไฟเดินห้องเย็น<b>${nf(kwh, 1)} kWh</b></div>
        <div>ลดคาร์บอน<b>${nf(co2, 1)} kg</b></div><div>แต้มที่แจก<b>${nf(pts)}</b></div><div>แต้มหมุนข้ามร้าน<b>${nf(circ)}</b></div></div>
      <div className="cap2" key=${step}><span className="k">${String(step).padStart(2, '0')}/08</span><span>${cap}</span></div>
      <div className="prog"><i style=${{ width: ph / LOOP_S * 100 + '%' }}></i></div>
    </div>
    <div className="simctl">
      <button className="btn primary" onClick=${() => setPlay(!play)}><${Icon} n=${play ? 'pause' : 'play'} s=${15} w=${2.2} />${play ? 'หยุด' : 'เล่น'}</button>
      <button className="btn" onClick=${() => setSpeed(speed === 1 ? 2 : speed === 2 ? 0.5 : 1)}>ความเร็ว ${speed}×</button>
      <button className="btn" onClick=${() => { S.current.t = 0; setHud(0); setPlay(true); }}><${Icon} n="reset" s=${15} /> เริ่มรอบใหม่</button>
      <button className="btn" onClick=${full}><${Icon} n="expand" s=${15} /> เต็มจอ (สำหรับอัดวิดีโอ)</button>
      <span style=${{ flex: 1 }}></span>
      ${Object.entries(MODS).map(([k, m]) => html`<button key=${k} className="mod" aria-pressed=${mods[k]} onClick=${() => toggle(k)}><span className="sw"></span><${Icon} n=${m.i} s=${16} c=${m.c} /><span>${m.n.replace('Module ', 'M')}</span></button>`)}
    </div>
    <p className="sub" style=${{ color: 'var(--muted)', fontSize: 12.5, margin: 0 }}>อัดเป็นวิดีโอ: กด "เต็มจอ" แล้วใช้ Win+Alt+R หรือ Snipping Tool โหมดวิดีโอ ได้ MP4 ไปวางใน Canva · ตัวเลขเป็นข้อมูลจำลอง</p>
  </div>`;
}

const SHOT_CAP = { vendor: '01 · แม่ค้าแยกเศษ ได้แต้ม แลกบริการ', porter: '02 · คนขนสแกนถัง ชั่ง ให้เกรด', market: '03 · ตลาดยืนยันแต้ม ขายปุ๋ย/แก๊ส ดูแลบ่อหมัก' };
function App() {
  const [s, d] = useReducer((st, f) => f(st), null, initState);
  const ref = useRef(s); ref.current = s; D = d; GET = () => ref.current;
  const [, tick] = useState(0);
  useEffect(() => { const t = setInterval(() => tick(x => x + 1), 1000); return () => clearInterval(t); }, []);

  const view = v => d(x => ({ ...x, view: v }));
  return html`<${React.Fragment}>
    <header className="top"><div className="brand"><${Logo} s=${38} /><div><b>${BRAND.th} · ${BRAND.name}</b><small>ต้นแบบ LINE OA + LIFF + Dashboard · ข้อมูลจำลอง</small></div></div>
      <div className="seg" role="group" aria-label="มุมมอง"><button aria-pressed=${s.view === 'flow'} onClick=${() => view('flow')} aria-label="Workflow"><${Icon} n="route" s=${16} /><span className="lg">Workflow</span></button>
        <button aria-pressed=${s.view === 'phone'} onClick=${() => view('phone')}><${Icon} n="phone" s=${16} /><span className="lg">หน้างาน (LINE)</span><span className="sm">LINE</span></button>
        <button aria-pressed=${s.view === 'shot'} onClick=${() => view('shot')} aria-label="แคปจอใส่สไลด์"><${Icon} n="frame" s=${16} /><span className="lg">แคปจอใส่สไลด์</span></button>
        <button aria-pressed=${s.view === 'dash'} onClick=${() => view('dash')} aria-label="Dashboard"><${Icon} n="chart" s=${16} /><span className="lg">Dashboard</span></button></div></header>
    ${s.view === 'phone' ? html`<main className="stage"><${Guide} s=${s} /><div className="center">${roleTabs}<${Phone} s=${s} /></div><${Log} s=${s} /></main>`
      : s.view === 'flow' || s.view === 'sim' ? html`<${Workflow} s=${s} />`
      : s.view === 'shot' ? html`<main className="shot">${roleTabs}<${Phone} s=${s} /><div className="cap">${SHOT_CAP[s.role]}<span className="lg"> · ใช้ Win+Shift+S ครอบเฉพาะตัวเครื่อง</span></div></main>`
      : html`<${Dashboard} s=${s} />`}
    ${s.toast && html`<div className="toast" role="status">${s.toast}</div>`}<//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
