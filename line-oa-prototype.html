<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>อิ่มต่อ FoodLoop Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: guide rail | LINE phone | live backend log — or a full-width owner dashboard */
:root{
  --bg:#edf2ee; --surface:#ffffff; --surface-2:#f5f8f5; --ink:#13241a; --muted:#5b6d61; --line:#d6e1d8;
  --accent:#06c755; --accent-ink:#047a35; --accent-soft:#dff5e7;
  --warn:#d98a00; --warn-soft:#fff2d9; --bad:#d8434a; --cold:#2a83c9; --cold-soft:#e3f0fb;
  --s-sold:#1f9d55; --s-disc:#e0a00a; --s-proc:#7a68d4; --s-don:#d9607a; --s-bio:#2c8fb0;
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-line:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Thonburi","Noto Sans Thai",sans-serif;
  /* phone stays in LINE's own light look in both themes */
  --l-green:#06c755; --l-chat:#8cabd9; --l-me:#8de055; --l-ink:#111; --l-sub:#8a8f98; --l-bar:#ffffff; --l-link:#42659a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1410; --surface:#141f19; --surface-2:#1a271f; --ink:#e4eee7; --muted:#93a79a; --line:#26372d;
  --accent:#2bd36f; --accent-ink:#5be393; --accent-soft:#163a25; --warn:#f0b13a; --warn-soft:#3a2c10;
  --bad:#f0686e; --cold:#5aa9e6; --cold-soft:#12293b;
  --s-sold:#3cc177; --s-disc:#eeb534; --s-proc:#9a8bec; --s-don:#ef8aa0; --s-bio:#4fb2d3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1410; --surface:#141f19; --surface-2:#1a271f; --ink:#e4eee7; --muted:#93a79a; --line:#26372d;
  --accent:#2bd36f; --accent-ink:#5be393; --accent-soft:#163a25; --warn:#f0b13a; --warn-soft:#3a2c10;
  --bad:#f0686e; --cold:#5aa9e6; --cold-soft:#12293b;
  --s-sold:#3cc177; --s-disc:#eeb534; --s-proc:#9a8bec; --s-don:#ef8aa0; --s-bio:#4fb2d3; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:700 20px/1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;position:relative}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px var(--f-mono);text-align:center}

/* stage */
.stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(250px,310px) auto minmax(230px,290px);gap:28px;justify-content:center;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.panel h3{margin:0 0 4px;font:600 15px/1.3 var(--f-display)}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.clock{display:flex;align-items:baseline;gap:10px;margin:8px 0 12px}
.clock .num{font-size:34px;font-weight:600;letter-spacing:-.02em}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface-2);padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.steps li:first-child{border-top:0}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font:600 12px/24px var(--f-mono);text-align:center}
.steps p{margin:0;font-size:13.5px;line-height:1.5}
.steps p em{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.steps .try{margin-top:6px;border:0;background:none;padding:0;color:var(--accent-ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.rule{display:flex;gap:10px;font-size:13px;color:var(--muted);padding:6px 0}
.rule b{color:var(--ink);font-weight:600}
details.panel summary{cursor:pointer;font:600 14px/1.3 var(--f-display);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.panel summary::-webkit-details-marker{display:none}
details.panel pre{font:11.5px/1.5 var(--f-mono);max-height:300px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);padding:10px;border-radius:10px;margin:12px 0 0;white-space:pre;color:var(--ink)}

.log{display:flex;flex-direction:column;max-height:640px;overflow:auto;margin:0 -6px;padding:0 6px}
.log .e{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.8px;animation:fadein .4s ease;min-width:0}
.log .e>span{min-width:0;overflow-wrap:anywhere}
.log .e:first-child{border-top:0}
.log .e .num{color:var(--muted);font-size:11.5px;padding-top:2px}
.log .tag{display:inline-block;font:600 10.5px/1 var(--f-mono);padding:3px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;background:var(--surface-2);color:var(--muted)}
.log .ok .tag{background:var(--accent-soft);color:var(--accent-ink)}
.log .warn .tag{background:var(--warn-soft);color:var(--warn)}
.log .cascade .tag{background:color-mix(in srgb,var(--s-proc) 18%,transparent);color:var(--s-proc)}
.log .cold .tag{background:var(--cold-soft);color:var(--cold)}
.log .api .tag{background:var(--ink);color:var(--bg)}
.log .api{color:var(--muted)}

.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.shot{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px 20px}
.shot .cap{font:600 14px var(--f-display);color:var(--muted)}

/* ---------- phone (LINE, reverse-engineered) ---------- */
.phone{width:384px;max-width:100%;height:800px;border-radius:52px;background:#0f1411;padding:11px;box-shadow:0 30px 60px -20px rgba(10,30,20,.45),0 0 0 1px rgba(0,0,0,.08);position:relative}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--l-chat);display:flex;flex-direction:column;position:relative;font-family:var(--f-line);color:var(--l-ink);isolation:isolate}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:#000;z-index:30}
.status{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 34px;font:600 14.5px/1 var(--f-line);background:var(--l-bar)}
.status .ic{display:flex;gap:5px;align-items:center}
.chathead{flex:none;display:flex;align-items:center;gap:4px;padding:4px 8px 9px;background:var(--l-bar)}
.chathead .t{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.chathead .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chathead button{border:0;background:none;padding:5px;color:#111;display:grid;place-items:center}
.msgs{flex:1;overflow-y:auto;padding:10px 12px 10px 8px;display:flex;flex-direction:column;gap:6px}
.msgs::-webkit-scrollbar{width:0}
.datechip{align-self:center;background:rgba(0,0,0,.16);color:#fff;font-size:12px;padding:3px 11px;border-radius:12px;margin:4px 0}
.row{display:flex;gap:8px;align-items:flex-start;animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
.row.first{margin-top:6px}
.row.me{flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center}
.who{font-size:12px;color:#1c2738;margin:0 0 4px 2px}
.bwrap{display:flex;align-items:flex-end;gap:5px}
.row.me .bwrap{flex-direction:row-reverse}
.meta{font-size:10px;color:#2c3a50;opacity:.8;line-height:1.25;white-space:nowrap;text-align:right;padding-bottom:1px}
.row:not(.me) .meta{text-align:left}
.bubble{background:#fff;border-radius:19px;padding:8px 13px;font-size:15px;line-height:1.42;white-space:pre-wrap;word-break:break-word;position:relative;max-width:232px}
.row.me .bubble{background:var(--l-me)}
.row.first .bubble::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:14px;background:inherit;clip-path:path('M14 0H3C1 0 0 1.6 1.7 3.1C5 6.2 7.4 9.6 8.8 14H14Z')}
.row.me.first .bubble::before{left:auto;right:-6px;clip-path:path('M0 0H11C13 0 14 1.6 12.3 3.1C9 6.2 6.6 9.6 5.2 14H0Z')}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#a3abb6;animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.photo{width:190px;height:150px;border-radius:14px;overflow:hidden;position:relative;display:grid;place-items:center}

/* Flex Message: bubble size "kilo/mega", link buttons default to #42659a */
.fx{width:264px;background:#fff;border-radius:17px;overflow:hidden}
.fx .hero{height:118px;position:relative;display:grid;place-items:center;overflow:hidden}
.fx .hero .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.9);color:#1d3b27}
.fx .hero .ringpos{position:absolute;right:10px;bottom:10px}
.fx .bd{padding:14px 16px 8px;display:flex;flex-direction:column;gap:6px}
.fx .ttl{font-weight:700;font-size:17px;line-height:1.25}
.fx .kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#666}
.fx .kv b{color:#111;font-weight:600;text-align:right}
.fx .price{font-size:24px;font-weight:700;color:#111;line-height:1.1}
.fx .price s{font-size:14px;color:#aaa;font-weight:400;margin-left:6px}
.fx .note{font-size:12.5px;color:#666;background:#f5f6f7;border-radius:8px;padding:7px 9px;line-height:1.45}
.fx .sep{height:1px;background:#eee;margin:2px 0}
.fx .ft{padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
.fbtn{border:0;border-radius:8px;height:42px;padding:0 10px;font-weight:500;font-size:15px;background:transparent;color:var(--l-link);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s}
.fbtn:hover{background:#f4f6f9}
.fbtn:active{transform:scale(.98)}
.fbtn.p{background:var(--l-green);color:#fff;font-weight:600}
.fbtn.w{background:#ff9f0a;color:#fff;font-weight:600}
.fbtn.c{background:#2a83c9;color:#fff;font-weight:600}
.fbtn.s{background:#dcdfe5;color:#111}
.fbtn[disabled]{opacity:.35;cursor:default}
.fbtn.chosen{opacity:1;background:#eef9f2;color:#0a7d39;font-weight:600}
.fx .hd{padding:12px 16px;color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.steps4{display:flex;align-items:flex-start;margin:6px 0 2px}
.steps4 .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:#9aa0a6;text-align:center;position:relative}
.steps4 .s::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:#e3e6ea;z-index:0}
.steps4 .s:first-child::before{display:none}
.steps4 .s.on::before,.steps4 .s.past::before{background:#06c755}
.steps4 .dot{width:18px;height:18px;border-radius:50%;background:#e3e6ea;z-index:1;display:grid;place-items:center;color:#fff}
.steps4 .past .dot{background:#06c755}
.steps4 .on .dot{background:#fff;border:4px solid #06c755}
.steps4 .on{color:#0a7d39;font-weight:700}
.steps4 .past{color:#4b5563}
.code{font:700 30px/1 var(--f-mono);letter-spacing:.12em;text-align:center;color:#111}
.mini{display:flex;flex-direction:column}
.mini .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef0f2;font-size:13px}
.mini .it:first-child{border-top:0}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.chip.g{background:#e3f8ea;color:#0a7d39}.chip.o{background:#fff1dc;color:#b86e00}.chip.v{background:#ece8ff;color:#5a46c4}.chip.b{background:#e3f0fb;color:#1f6fae}.chip.x{background:#f1f3f5;color:#6b7280}.chip.r{background:#ffe9ec;color:#c2334a}

/* quick reply */
.qr{flex:none;display:flex;gap:8px;overflow-x:auto;padding:6px 10px 8px;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr button{flex:none;border:0;background:#fff;color:#111;border-radius:999px;padding:7px 14px;font:500 14px var(--f-line);display:flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.2);animation:pop .3s ease}
.qr button svg{color:#06c755}

/* bottom bar: rich-menu chat bar / input bar */
.bar{flex:none;background:#fff;display:flex;align-items:center;gap:2px;padding:6px 6px calc(6px + 16px);border-top:1px solid #e6e6e6}
.bar .ib{border:0;background:none;width:36px;height:36px;padding:0;color:#2b2b2b;display:grid;place-items:center;border-radius:8px;flex:none}
.bar .ib:hover{background:#f2f3f5}
.field{flex:1;min-width:0;display:flex;align-items:center;background:#f2f2f2;border-radius:18px;padding:0 4px 0 13px;height:36px}
.field input{flex:1;min-width:0;width:0;border:0;background:transparent;font:15px var(--f-line);color:#111;outline:none;padding:0}
.field input::placeholder{color:#a5a5a5}
.field button{border:0;background:none;padding:4px;color:#8a8a8a;display:grid;place-items:center}
.send{color:var(--l-green)!important}
.menuToggle{flex:1;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:5px;font:600 14.5px var(--f-line);color:#111;height:36px}

/* rich menu = one 2500x1686 image + invisible tap areas (LINE Messaging API format) */
.rich{flex:none;max-height:0;overflow:hidden;background:#fff;transition:max-height .32s cubic-bezier(.3,.8,.3,1)}
.rich.open{max-height:320px}
.rimg{position:relative;aspect-ratio:2500/1686;max-width:100%}
.rimg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rimg .area{position:absolute;border:0;background:transparent;padding:0;transition:background .12s}
.rimg .area:active{background:rgba(0,0,0,.1)}
.rimg .area:focus-visible{outline:3px solid #06c755;outline-offset:-3px}

/* LIFF */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:fadein .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;height:88%;background:#f6f7f9;border-radius:12px 12px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .36s cubic-bezier(.2,.9,.25,1);overflow:hidden}
.sheet .sh{flex:none;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:8px 6px;background:#fff;border-bottom:1px solid #ececec}
.sheet .sh .t{text-align:center;min-width:0}
.sheet .sh .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh .t small{color:#999;font-size:11px}
.sheet .sh button{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#222}
.sheet .sb{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.sheet .sb::-webkit-scrollbar{width:0}
.card{background:#fff;border-radius:14px;padding:14px}
.lbl{font-size:12px;color:#6b7280;font-weight:500}
.big{font-size:28px;font-weight:700;line-height:1.1}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border-radius:12px;border:0;background:#eef0f3;font-size:20px;font-weight:600}
.stepper .v{min-width:44px;text-align:center;font:700 22px var(--f-mono)}
.cta{border:0;border-radius:12px;padding:14px;background:var(--l-green);color:#fff;font-weight:700;font-size:16px;width:100%}
.cta[disabled]{background:#c5cad1}
.cta.c{background:#2a83c9}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1.5px solid #dfe3e8;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#374151}
.pills button[aria-pressed="true"]{border-color:#06c755;background:#eafaf0;color:#0a7d39}
.gauge{height:10px;border-radius:5px;background:#e8ebef;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:5px;transition:width .6s ease}
.viewfinder{aspect-ratio:1/1;max-width:100%;border-radius:20px;background:radial-gradient(circle at 50% 40%,#3a4a3f,#141a16);position:relative;overflow:hidden;display:grid;place-items:center}
.viewfinder .corner{position:absolute;width:40px;height:40px;border:4px solid #06c755}
.viewfinder .scanline{position:absolute;left:12%;right:12%;height:3px;background:linear-gradient(90deg,transparent,#5cff9d,transparent);box-shadow:0 0 18px #5cff9d;animation:scan 1.6s ease-in-out infinite alternate}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{border:0;background:#fff;border-radius:14px;padding:13px 0;font:600 21px var(--f-mono)}
.keypad button:active{background:#e6f9ee}
.grade{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border:2px solid #e5e8ec;background:#fff;border-radius:16px;padding:12px;text-align:left;width:100%}
.grade[aria-pressed="true"]{border-color:#06c755;background:#f0fcf4}
.grade .g{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 26px var(--f-mono);color:#fff}
.burst{animation:burst .7s cubic-bezier(.2,1.4,.4,1)}
.listing{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px}
.listing .th{width:62px;height:62px;border-radius:12px;display:grid;place-items:center}

/* ---------- dashboard ---------- */
.dash{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px}
.dhead h1{font:700 clamp(24px,3vw,32px)/1.15 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.dhead p{margin:4px 0 0;color:var(--muted)}
.dhead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.notice{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:9px 14px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font:600 30px/1.1 var(--f-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font:500 14px var(--f-body);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .l{font-size:13px;font-weight:600}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .pill{align-self:flex-start;font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:6px;margin-top:4px}
.pill.good{background:var(--accent-soft);color:var(--accent-ink)}
.pill.meh{background:var(--warn-soft);color:var(--warn)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.grid2>*{min-width:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar-in{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar-in i{display:block;height:100%;background:var(--accent)}
.assume{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.assume label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.assume input{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:7px 10px;font:500 14px var(--f-mono)}
.calc .it{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.calc .it:first-child{border-top:0}
.calc .it span{flex:1;color:var(--muted)}
.calc .tot{font-weight:600}
.calc .tot span{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;animation:pop .3s ease}

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes scan{from{top:18%}to{top:80%}}
@keyframes burst{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@media (max-width:1180px){
  .stage{grid-template-columns:minmax(250px,320px) auto}
  .stage .col.right{grid-column:1 / -1}
  .log{max-height:320px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .stage .center{order:-1;min-width:0;width:100%}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:600px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sm{display:none}
/* phone portrait: the page itself becomes the LINE app, no fake device around it */
@media (max-width:600px){
  body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));touch-action:manipulation;-webkit-text-size-adjust:100%}
  /* iOS Safari zooms the page when a focused field is under 16px */
  .field input,.assume input{font-size:16px}
  .lg{display:none}.sm{display:inline}
  .bar .ib{width:32px}
  .shot{width:100%}
  .top{flex-wrap:nowrap;gap:10px;padding-block:10px 8px}
  .brand{gap:8px;min-width:0}
  .brand svg{width:30px;height:30px}
  .brand b{font-size:16px;white-space:nowrap}
  .brand small{display:none}
  .top .seg{flex-wrap:nowrap;flex:none}
  .top .seg button{padding:7px 10px;font-size:13px;gap:5px}
  .center{gap:8px}
  .center .seg,.shot .seg{display:grid;grid-template-columns:repeat(4,1fr);width:100%;border-radius:16px;padding:3px}
  .center .seg button,.shot .seg button{flex-direction:column;gap:2px;padding:6px 2px;border-radius:13px;font-size:12px;justify-content:center}
  .center .seg .badge,.shot .seg .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;line-height:16px;font-size:10px}
  .phone{width:100%;height:calc(100svh - 128px);min-height:540px;max-height:860px;border-radius:22px;padding:0;background:none;box-shadow:0 12px 32px -14px rgba(10,30,20,.45),0 0 0 1px rgba(10,30,20,.08)}
  .screen{border-radius:22px}
  .island,.status{display:none}
  .chathead{padding-top:10px}
  .bar{padding-bottom:8px}
  .rich.open{max-height:260px}
  .fx{width:min(264px,calc(100vw - 120px))}
  .bubble{max-width:min(232px,calc(100vw - 130px))}
  .shot .cap{font-size:12.5px;text-align:center}
}
@media print{
  .top,.notice .np,.dhead .sp{display:none!important}
  body{background:#fff}
}

const BRAND = { name: 'FoodLoop', th: 'อิ่มต่อ', market: 'ตลาดสดเทศบาล', tagline: 'ส่งต่อวัตถุดิบส่วนเกิน ทันก่อนหมดเวลา' };
const ME = { vendor: { name: 'ป้าแดง', stall: 'B12' }, porter: { name: 'พี่เอก' }, buyer: { name: 'ครัวป้าศรี' }, processor: { name: 'น้ำพริกแม่บุญ' } };
const MIN = 60000;

const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const nf = (n, d = 0) => Number(n).toLocaleString('th-TH', { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtRem = ms => { if (ms <= 0) return 'หมดเวลา'; const m = Math.floor(ms / MIN), s = Math.floor(ms / 1000) % 60;
  if (m >= 60) return `${Math.floor(m / 60)} ชม. ${m % 60} น.`; return `${m}:${String(s).padStart(2, '0')}`; };
function shade(hex, amt) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt); r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); }

const PRODUCTS = [
  { key: 'คะน้า', alias: ['คะน้า', 'คะนา'], kind: 'leaf', color: '#3f9a3a', base: 40, ttl: 180 },

  { key: 'ผักกาด', alias: ['ผักกาด', 'กวางตุ้ง'], kind: 'leaf', color: '#6cb84a', base: 35, ttl: 180 },

  { key: 'มะเขือเทศ', alias: ['มะเขือเทศ'], kind: 'round', color: '#e2463a', base: 35, ttl: 360 },

  { key: 'แตงกวา', alias: ['แตงกวา', 'แตง'], kind: 'long', color: '#5aa845', base: 25, ttl: 360 },
];
const UNIT = { 'กก': 'กก', 'กก.': 'กก', 'กิโล': 'กก', 'กิโลกรัม': 'กก', 'kg': 'กก', 'โล': 'กก', 'มัด': 'มัด', 'กำ': 'กำ', 'ถุง': 'ถุง', 'ลัง': 'ลัง', 'หวี': 'หวี' };
const kgOf = l => l.unit === 'กก' ? l.qty : l.unit === 'หวี' ? l.qty * 1.2 : l.unit === 'ลัง' ? l.qty * 8 : l.qty * 0.5;

// parser: "คะน้า 3 กก 40" -> ชื่อ / จำนวน / หน่วย / ราคา (ราคาเหมาทั้งกอง)
function parseListing(text) {
  const t = text.trim().replace(/\s+/g, ' ');
  let prod = null, alias = '';
  for (const p of PRODUCTS) for (const a of p.alias) if (t.includes(a) && a.length > alias.length) { prod = p; alias = a; }
  let qty = null, unit = null, price = null; const loose = [];
  const re = /(฿\s*)?(\d+(?:\.\d+)?)\s*(กิโลกรัม|กิโล|กก\.?|kg|โล|มัด|กำ|ถุง|ลัง|หวี|บาท)?/gi; let m;
  while ((m = re.exec(t))) { const n = parseFloat(m[2]); const u = (m[3] || '').toLowerCase();
    if (m[1] || u === 'บาท') price = n; else if (u) { qty = n; unit = UNIT[u] || u; } else loose.push(n); }
  if (qty == null && loose.length) qty = loose.shift();
  if (price == null && loose.length) price = loose.shift();
  const name = prod ? prod.key : t.replace(/[฿\d].*$/, '').trim();
  if (!name || qty == null || name.length > 24) return null;
  const p = prod || { kind: 'leaf', color: '#58a64a', base: 30, ttl: 240 };
  const suggested = price == null;
  if (suggested) price = Math.max(10, Math.round(qty * p.base * 0.5 / 5) * 5);
  return { name, kind: p.kind, color: p.color, qty, unit: unit || 'กก', price, suggested, ttl: p.ttl, base: p.base, known: !!prod };
}

/* ======================= SVG pieces ======================= */
const ICONS = {

  bag: 'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2', bell: 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0',
  check: 'M5 12.5l4.5 4.5L19 7', clock: 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 7v5l3 2', close: 'M6 6l12 12M18 6L6 18',
  chevD: 'M6 9l6 6 6-6', chevU: 'M6 15l6-6 6 6', chevR: 'M9 6l6 6-6 6', truck: 'M3 6h11v10H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-.01M17 19a2 2 0 1 0 0-.01',
  bolt: 'M13 3L5 13h6l-1 8 8-10h-6z', phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z',
  fast: 'M4 6l8 6-8 6zM12 6l8 6-8 6z', reset: 'M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4', doc: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
  store: 'M4 9l1.5-5h13L20 9M4 9h16v11H4zM4 9c0 2 3.5 2 4 0 .5 2 3.5 2 4 0 .5 2 3.5 2 4 0 .5 2 4 2 4 0M10 20v-5h4v5', chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',

const Icon = ({ n, s = 22, w = 1.8, c = 'currentColor' }) => html`<svg viewBox="0 0 24 24" width=${s} height=${s} fill="none" stroke=${c} strokeWidth=${w} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d=${ICONS[n]} /></svg>`;

  <rect width="40" height="40" rx="20" fill="#06c755"/>
  <path d="M12 27c-2-8 4-15 16-15 0 10-6 16-14 15z" fill="#fff"/>

const Verified = () => html`<svg viewBox="0 0 16 16" width="17" height="17" aria-label="บัญชีที่ได้รับการรับรอง"><path d="M8 1l5.5 2v4.3c0 3.6-2.4 6.3-5.5 7.7C4.9 13.6 2.5 10.9 2.5 7.3V3z" fill="#06c755"/><path d="M5.2 8.1l1.9 1.9 3.8-3.8" stroke="#fff" strokeWidth="1.7" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>`;

function Veg({ kind = 'leaf', color = '#3f9a3a', size = 56 }) {
  const c = color, d = shade(c, -0.28), l = shade(c, 0.45), stem = '#3b8a2e';
  let g;
  if (kind === 'leaf') g = html`${[-30, -10, 10, 30].map((r, i) => html`<g key=${i} transform=${`translate(32 58) rotate(${r})`}>
      <path d="M0 0 C-12 -14 -11 -35 0 -47 C11 -35 12 -14 0 0Z" fill=${i % 2 ? c : shade(c, 0.14)} />

  else if (kind === 'cabbage') g = html`<circle cx="32" cy="35" r="23" fill=${c} /><path d="M12 38C18 21 46 21 52 38" stroke=${d} strokeWidth="2.2" fill="none" />
      <path d="M18 48C24 33 40 33 46 48" stroke=${d} strokeWidth="2.2" fill="none" /><path d="M32 13V57" stroke=${l} strokeWidth="2" /><ellipse cx="23" cy="24" rx="6" ry="3.5" fill="#fff" opacity=".3" />`;
  else if (kind === 'round') g = html`<circle cx="32" cy="36" r="21" fill=${c} /><ellipse cx="24" cy="28" rx="6" ry="3.5" fill="#fff" opacity=".35" />
      <path d="M32 17l3-6 1 6 6-2-4 5 5 3-7 0-4 4-4-4-7 0 5-3-4-5 6 2 1-6z" fill=${stem} />`;
  else if (kind === 'chili') g = html`<path d="M20 18C24 33 32 47 52 54C40 58 20 50 14 24Z" fill=${c} /><path d="M20 19C17 12 21 7 26 9" stroke=${stem} strokeWidth="3.4" fill="none" strokeLinecap="round" />

  else g = html`<g transform="rotate(-22 32 34)"><rect x="9" y="26" width="46" height="16" rx="8" fill=${c} />${[18, 27, 36, 45].map(x => html`<circle key=${x} cx=${x} cy=${31 + (x % 2) * 5} r="1.3" fill=${l} />`)}</g>`;
  return html`<svg viewBox="0 0 64 64" width=${size} height=${size} aria-hidden="true">${g}</svg>`;
}

function QR({ seed = 'A', size = 104 }) {
  const n = 25; let h = 2166136261; for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const fin = (x, y) => { for (const [fx, fy] of [[0, 0], [n - 7, 0], [0, n - 7]]) { const dx = x - fx, dy = y - fy;
      if (dx >= -1 && dx <= 7 && dy >= -1 && dy <= 7) { if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return 0;
        return (dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)) ? 1 : 0; } } return -1; };
  let d = ''; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const f = fin(x, y); if (f === 1 || (f === -1 && rnd() > 0.52)) d += `M${x} ${y}h1v1h-1z`; }
  return html`<svg viewBox=${`-2 -2 ${n + 4} ${n + 4}`} width=${size} height=${size} style=${{ background: '#fff', borderRadius: 8 }} aria-label="QR code"><path d=${d} fill="#111" /></svg>`;
}

function Ring({ rem, total, size = 48 }) {
  const f = Math.max(0, Math.min(1, rem / total)), r = size / 2 - 4, C = 2 * Math.PI * r;
  const col = rem <= 10 * MIN ? '#e5484d' : rem <= 30 * MIN ? '#ff9f0a' : '#06c755';
  const m = Math.max(0, Math.ceil(rem / MIN));
  return html`<svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`} aria-label=${'เหลือ ' + m + ' นาที'}>
    <circle cx=${size / 2} cy=${size / 2} r=${r + 3} fill="#fff" />

const simNow = s => Date.now() + s.offset;
const addMsg = (s, role, m) => { const msg = { id: uid(), t: simNow(s), ...m }; const unread = m.from !== 'me' && role !== s.role ? { ...s.unread, [role]: s.unread[role] + 1 } : s.unread;
  return { ...s, chats: { ...s.chats, [role]: [...s.chats[role], msg] }, unread }; };
const patchMsg = (s, role, id, f) => ({ ...s, chats: { ...s.chats, [role]: s.chats[role].map(m => m.id === id ? f(m) : m) } });
const patchL = (s, id, f) => ({ ...s, listings: s.listings.map(l => l.id === id ? { ...l, ...f(l) } : l) });
const addLog = (s, text, tone = '') => ({ ...s, log: [{ id: uid(), t: simNow(s), text, tone }, ...s.log].slice(0, 60) });
const setTyping = (s, role, v) => ({ ...s, typing: { ...s.typing, [role]: v } });
const routeKey = st => ({ sell: 'sold', discount: 'disc', process: 'proc', donate: 'don' }[st] || 'sold');
const procPrice = l => Math.max(5, Math.round(l.base * 0.35 / 5) * 5);

function tick(s) {
  const now = simNow(s); let x = s;
  for (const l of s.listings) {
    if (l.status !== 'active') continue;
    const rem = l.deadline - now;
    if (l.stage === 'sell' && !l.pushed && rem <= 30 * MIN && rem > 0) {
      x = patchL(x, l.id, () => ({ pushed: true }));
      if (l.mine) x = addMsg(x, 'vendor', { from: 'bot', kind: 'flex', card: { type: 'ttl', lid: l.id } });
      x = addLog(x, `${l.name} (${l.stall}) เหลือ 30 นาที → push ถามแม่ค้าว่าจะลดราคาไหม`, 'warn');
    } else if (rem <= 0) {
      if (l.stage === 'sell' || l.stage === 'discount') {
        const np = procPrice(l);
        x = patchL(x, l.id, () => ({ stage: 'process', deadline: now + STAGE_WIN.process, price: np }));
        if (l.mine) x = addMsg(x, 'vendor', { from: 'bot', kind: 'flex', card: { type: 'cascade', lid: l.id, stage: 1 } });
        x = addMsg(x, 'processor', { from: 'bot', kind: 'flex', card: { type: 'newitem', lid: l.id, reason: 'process' } });
        x = addLog(x, `Auto-Cascade: ${l.name} (${l.stall}) ขายไม่ทัน → push ร้านแปรรูป ฿${np}`, 'cascade');
      } else if (l.stage === 'process') {
        x = patchL(x, l.id, () => ({ stage: 'donate', deadline: now + STAGE_WIN.donate, price: 0 }));
        if (l.mine) x = addMsg(x, 'vendor', { from: 'bot', kind: 'flex', card: { type: 'cascade', lid: l.id, stage: 2 } });
        x = addLog(x, `Auto-Cascade: ${l.name} (${l.stall}) ไม่มีร้านแปรรูปรับ → แจ้งโรงทาน/มูลนิธิรับฟรี`, 'cascade');
      } else if (l.stage === 'donate') {
        const job = { id: uid(), shop: l.shop, stall: l.stall, est: Math.max(1, Math.round(kgOf(l))), status: 'open', note: `${l.name} ที่ไม่มีคนรับ` };
        x = patchL(x, l.id, () => ({ stage: 'organic', status: 'organic' }));
        x = { ...x, jobs: [job, ...x.jobs], demo: { ...x.demo, closed: x.demo.closed + 1 } };
        if (l.mine) x = addMsg(x, 'vendor', { from: 'bot', kind: 'flex', card: { type: 'cascade', lid: l.id, stage: 3 } });
        x = addMsg(x, 'porter', { from: 'bot', kind: 'flex', card: { type: 'job', jid: job.id } });
        x = addLog(x, `Auto-Cascade: ${l.name} → เศษอินทรีย์ แจ้งคนขนไปรับที่ ${l.stall}`, 'cascade');
      }
    }
  }
  return x === s ? { ...s } : x;
}

    <div style=${{ position: 'absolute', bottom: 10, left: '12%', right: '12%', height: '44%', background: 'repeating-linear-gradient(90deg,#b07a3f 0 8px,#9a6633 8px 10px)', borderRadius: '6px 6px 18px 18px' }}></div>
    <div style=${{ position: 'absolute', bottom: '30%', display: 'flex' }}>${[0, 1, 2].map(k => html`<div key=${k} style=${{ margin: '0 -10px', transform: `rotate(${(k - 1) * 14}deg) translateY(${k === 1 ? -8 : 0}px)` }}><${Veg} kind=${p.kind} color=${p.color} size=${h * 0.46} /></div>`)}</div>
    <div style=${{ position: 'absolute', inset: 0, background: 'radial-gradient(circle at 70% 20%, rgba(255,255,255,.25), transparent 50%)' }}></div></div>`;
}

function Btns({ m, role, items }) {
  return html`<div className="ft">${items.map((b, k) => {
    const chosen = m.done === b.label; const dis = !b.keep && !!m.done && !chosen;
    return html`<button key=${k} className=${'fbtn ' + (b.cls || '') + (chosen ? ' chosen' : '')} disabled=${dis || chosen}
      onClick=${() => { if (!b.keep) D(s => patchMsg(s, role, m.id, x => ({ ...x, done: b.label }))); if (b.echo) me(role, b.label); hook(`webhook · postback action=${b.a}${b.arg && typeof b.arg === 'string' ? '&id=' + b.arg : ''}`); act(role, b.a, b.arg, m); }}>
      ${b.i && html`<${Icon} n=${b.i} s=${17} w=${2.2} />`}${chosen ? html`<${Icon} n="check" s=${16} w=${2.6} />` : ''}${b.label}</button>`; })}</div>`;
}
const Head = ({ bg, i, children }) => html`<div className="hd" style=${{ background: bg }}><${Icon} n=${i} s=${20} w=${2.2} />${children}</div>`;
const G = { green: 'linear-gradient(135deg,#06c755,#049a42)', blue: 'linear-gradient(135deg,#2a83c9,#1d5f99)', orange: 'linear-gradient(135deg,#ff9f0a,#f57c00)', violet: 'linear-gradient(135deg,#7a68d4,#5a46c4)', rose: 'linear-gradient(135deg,#e5607a,#c2334a)', teal: 'linear-gradient(135deg,#2c8fb0,#1f6f8b)', dark: '#1f2933' };

function FlexCard({ m, role, s }) {
  const c = m.card; const now = simNow(s); const L = id => s.listings.find(l => l.id === id);
  switch (c.type) {
    case 'welcome': {
      const txt = { vendor: [`สวัสดีค่ะ ${ME.vendor.name} แผง ${ME.vendor.stall}`, 'ลงของเหลือได้ใน 3 แตะ ของที่ขายไม่ทันบอทส่งต่อให้เอง และเศษที่คัดดีได้เครดิตฝากห้องเย็นฟรี'],
        porter: [`สวัสดีค่ะ ${ME.porter.name}`, 'สแกน QR ถังเขียวของร้าน ใส่น้ำหนัก เลือกเกรด ได้แต้มทันที แต้มใช้เป็นส่วนลดซื้อผัก ไข่ ข้าว จากฟาร์มพันธมิตร'],
        buyer: [`สวัสดีค่ะ ${ME.buyer.name}`, `ของสดลดราคาจากแผงใน${BRAND.market} มีเวลานับถอยหลังทุกชิ้น กดรับแล้วรับรหัสไปแสดงที่แผง`],
        processor: [`สวัสดีค่ะ ${ME.processor.name}`, 'ของที่แผงขายไม่ทันจะส่งมาที่แชทนี้อัตโนมัติ ราคาต่ำกว่าตลาด 60–80% กดรับแล้วรับรหัสไปแสดงที่แผง'] }[c.role];
      return html`<div className="fx"><div className="hero" style=${{ height: 96, background: 'linear-gradient(135deg,#06c755,#0aa04a)' }}>
        <div style=${{ position: 'absolute', inset: 0, background: 'radial-gradient(circle at 85% 0%, rgba(255,255,255,.3), transparent 45%)' }}></div>
        <div style=${{ display: 'flex', alignItems: 'center', gap: 10, color: '#fff', position: 'relative' }}><${Logo} s=${44} /><div><div style=${{ fontWeight: 700, fontSize: 18 }}>${BRAND.th} · ${BRAND.name}</div><div style=${{ fontSize: 12, opacity: .9 }}>${BRAND.tagline}</div></div></div></div>
        <div className="bd"><div className="ttl">${txt[0]}</div><div style=${{ fontSize: 13.5, color: '#555', lineHeight: 1.5, paddingBottom: 8 }}>${txt[1]}</div></div></div>`;
    }
    case 'draft': {
      const d = c.draft; const end = now + d.ttl * MIN;
      return html`<div className="fx"><${Hero} kind=${d.kind} color=${d.color}><span className="tag">ร่างประกาศ · ตรวจก่อนยืนยัน</span><//>
        <div className="bd"><div className="ttl">${d.name}</div>
          <div className="kv"><span>จำนวน</span><b>${d.qty} ${d.unit}</b></div>
          <div style=${{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}><div className="price">฿${d.price}</div><span style=${{ fontSize: 12, color: '#888' }}>ทั้งกอง · ≈฿${nf(d.price / Math.max(d.qty, 1), 1)}/${d.unit}</span></div>
          <div className="note"><b>แนะนำขายภายใน ${d.ttl >= 60 ? nf(d.ttl / 60, d.ttl % 60 ? 1 : 0) + ' ชม.' : d.ttl + ' นาที'}</b> (ถึง ${hm(end)})<br/>ราคาตลาดวันนี้ ≈ ฿${d.base}/${d.unit}${d.suggested ? ' · ราคานี้บอทแนะนำ' : ''}</div></div>
        <${Btns} m=${m} role=${role} items=${[{ label: 'ยืนยันลงขาย', a: 'draft-confirm', cls: 'p', echo: true }, { label: 'แก้ราคา', a: 'draft-price', keep: true }, { label: 'ยกเลิก', a: 'draft-cancel', echo: true }]} /></div>`;
    }
    case 'live': {
      const l = L(c.lid); if (!l) return null; const rem = l.deadline - now; const i = STAGE_I[l.stage];
      const views = Math.min(48, Math.floor((now - l.created) / MIN * 0.4) + 3);
      const st = l.status === 'claimed' ? html`<span className="chip g">มีคนรับแล้ว · ${l.code}</span>` : l.status === 'organic' ? html`<span className="chip b">ไบโอแก๊ส</span>`
        : l.stage === 'discount' ? html`<span className="chip o">ลดราคา</span>` : html`<span className=${'chip ' + ['g', 'v', 'r', 'b'][i]}>${i ? STAGES[i] : 'กำลังขาย'}</span>`;
      return html`<div className="fx"><${Hero} kind=${l.kind} color=${l.color}><span className="tag">ประกาศแล้ว · ${l.stall}</span>

    }
    case 'ttl': {
      const l = L(c.lid); if (!l) return null; const rem = l.deadline - now; const np = Math.max(5, Math.round(l.price * 0.6 / 5) * 5);
      return html`<div className="fx"><${Head} bg=${G.orange} i="clock">ใกล้หมดเวลา · เหลือ <span className="num" style=${{ animation: 'pulse 1.4s infinite' }}>${l.status === 'active' ? fmtRem(rem) : '-'}</span><//>
        <div className="bd" style=${{ flexDirection: 'row', alignItems: 'center', gap: 12 }}><div style=${{ width: 64, height: 64, borderRadius: 12, background: shade(l.color, .78), display: 'grid', placeItems: 'center', flex: 'none' }}><${Veg} kind=${l.kind} color=${l.color} size=${50} /></div>
          <div><div className="ttl" style=${{ fontSize: 15 }}>${l.name} ${l.qty} ${l.unit} ยังไม่มีคนรับ</div><div style=${{ fontSize: 13, color: '#555' }}>ลดเป็น <b style=${{ color: '#0a8a3e' }}>฿${np}</b> ไหมคะ ราคาที่ลดตามเวลาช่วยให้คนกดรับเร็วขึ้น</div></div></div>

    }
    case 'cascade': {
      const l = L(c.lid); if (!l) return null;
      const T = { 1: [G.violet, 'truck', `ส่งต่อ ${l.name} ให้ร้านแปรรูปแล้ว`, `แจ้งร้านอาหารและโรงแปรรูป 6 ราย ราคา ฿${procPrice(l)} ภายใน 2 ชม. ป้าไม่ต้องทำอะไรเพิ่มค่ะ`],
        2: [G.rose, 'heart', `ส่ง ${l.name} ให้โรงทานแล้ว`, 'ร้านแปรรูปไม่รับภายในเวลา บอทแจ้งโรงทานและมูลนิธิอาหารในชุมชนให้มารับฟรีภายใน 1 ชม.'],
        3: [G.teal, 'leaf', `${l.name} ส่งเข้าบ่อไบโอแก๊ส`, `แจ้งคนขนไปรับที่แผง ${l.stall} แล้ว ถ้าคัดสะอาดได้เกรด A ป้าจะได้เครดิตห้องเย็นเพิ่มค่ะ`] }[c.stage];
      return html`<div className="fx"><${Head} bg=${T[0]} i=${T[1]}>ส่งต่ออัตโนมัติ<//>
        <div className="bd"><div className="ttl" style=${{ fontSize: 15 }}>${T[2]}</div><div style=${{ fontSize: 13, color: '#555' }}>${T[3]}</div><${Steps4} i=${c.stage} /></div><div style=${{ height: 8 }}></div></div>`;
    }
    case 'credit': {
      const next = 1 - (s.credits % 1);
      return html`<div className="fx"><div className="hd" style=${{ background: G.blue, paddingBlock: 16 }}><div><div style=${{ fontSize: 12, opacity: .85, fontWeight: 500 }}>เครดิตห้องเย็นของ${ME.vendor.name}</div><div style=${{ fontSize: 32, lineHeight: 1.1 }}><span className="num">${nf(s.credits, 1)}</span> <span style=${{ fontSize: 15 }}>ลัง-คืน</span></div></div></div>
        <div className="bd"><div style=${{ fontSize: 12.5, color: '#555' }}>เศษเกรด A 10 กก. = ฝาก 1 ลัง 1 คืน · อีก ${nf(next * 10, 0)} กก. ได้เพิ่ม 1 · เครดิตหมดอายุใน 30 วัน</div>
          <div className="mini">${s.creditLog.slice(0, 4).map((h, k) => html`<div key=${k} className="it"><span style=${{ flex: 1 }}>${h.text}</span><b className="num" style=${{ color: h.v > 0 ? '#0a8a3e' : '#b91c1c' }}>${h.v > 0 ? '+' : ''}${nf(h.v, 1)}</b></div>`)}</div></div>
        <${Btns} m=${m} role=${role} items=${[{ label: 'จองห้องเย็น', a: 'open-cold', cls: 'c', keep: true }, { label: 'ใช้เป็นส่วนลดฟาร์ม', a: 'redeem-open', keep: true }]} /></div>`;
    }
    case 'voucher': return html`<div className="fx"><${Head} bg=${G.green} i=${c.item.i}>แลกสำเร็จ<//>
        <div className="bd" style=${{ alignItems: 'center', textAlign: 'center' }}><div className="ttl">${c.item.t}</div><div style=${{ fontSize: 12.5, color: '#888' }}>${c.item.d}</div>
        <${QR} seed=${c.code} size=${104} /><div className="code" style=${{ fontSize: 24 }}>${c.code}</div>
        <div style=${{ width: '100%' }}><div className="kv"><span>ใช้ไป</span><b>${c.item.cost} ${REWARDS[role].unit}</b></div><div className="kv"><span>คงเหลือ</span><b className="num">${nf(balOf(s, role), role === 'porter' ? 0 : 1)} ${REWARDS[role].unit}</b></div></div>
        <div style=${{ fontSize: 12, color: '#888' }}>แสดง QR ตอนซื้อหรือตอนฟาร์มมาส่งของ · ใช้ได้ภายใน 30 วัน</div></div><div style=${{ height: 8 }}></div></div>`;
    case 'creditgain': return html`<div className="fx"><${Head} bg=${G.blue} i="snow">ได้เครดิตห้องเย็น<//>
        <div className="bd"><div style=${{ display: 'flex', alignItems: 'baseline', gap: 6 }}><span className="price burst num" style=${{ color: '#1d5f99' }}>+${nf(c.cr, 1)}</span><span>ลัง-คืน</span></div>
        <div style=${{ fontSize: 13, color: '#555' }}>ขอบคุณที่แยกเศษค่ะ คนขนรับไป ${c.kg} กก. ได้เกรด ${c.grade} เศษนี้เข้าบ่อไบโอแก๊สที่เดินห้องเย็นของตลาด</div>
        <div className="kv"><span>คงเหลือ</span><b className="num">${nf(s.credits, 1)} ลัง-คืน</b></div></div>
        <${Btns} m=${m} role=${role} items=${[{ label: 'จองห้องเย็นคืนนี้', a: 'open-cold', keep: true }]} /></div>`;
    case 'booking': return html`<div className="fx"><${Head} bg=${G.blue} i="snow">จองห้องเย็นสำเร็จ<//>
        <div className="bd" style=${{ alignItems: 'center', textAlign: 'center' }}><${QR} seed=${c.code} size=${116} /><div className="code">${c.code}</div>
        <div style=${{ fontSize: 12.5, color: '#888' }}>แสดง QR นี้ที่หน้าห้องเย็น โซน B</div>
        <div style=${{ width: '100%' }}><div className="kv"><span>ฝาก</span><b>${c.crates} ลัง × ${c.nights} คืน</b></div><div className="kv"><span>เข้าห้องเย็น</span><b>${c.slot}</b></div><div className="kv"><span>อุณหภูมิ</span><b>4°C</b></div><div className="kv"><span>ใช้เครดิต</span><b>${c.crates * c.nights} ลัง-คืน</b></div></div></div><div style=${{ height: 8 }}></div></div>`;
    case 'sold': {
      const mine = s.listings.filter(l => l.mine);
      const chip = l => l.status === 'claimed' ? html`<span className="chip g">ขายแล้ว</span>` : l.status === 'organic' ? html`<span className="chip b">ไบโอแก๊ส</span>` : l.stage === 'donate' ? html`<span className="chip r">บริจาค</span>`
        : l.stage === 'process' ? html`<span className="chip v">แปรรูป</span>` : l.stage === 'discount' ? html`<span className="chip o">ลดราคา</span>` : html`<span className="chip x">กำลังขาย</span>`;
      return html`<div className="fx"><${Head} bg=${G.dark} i="receipt">ของของ${ME.vendor.name}วันนี้<//>
        <div className="bd"><div className="mini">${mine.map(l => html`<div key=${l.id} className="it"><${Veg} kind=${l.kind} color=${l.color} size=${30} /><div style=${{ flex: 1, minWidth: 0 }}><b>${l.name}</b> ${l.qty} ${l.unit}<div style=${{ fontSize: 12, color: '#888' }}>฿${l.price}${l.code ? ' · รหัส ' + l.code : l.status === 'active' ? ' · เหลือ ' + fmtRem(l.deadline - now) : ''}</div></div>${chip(l)}</div>`)}</div>
          <div className="kv" style=${{ borderTop: '1px solid #eef0f2', paddingTop: 8 }}><span>รายได้วันนี้</span><b className="num">฿${nf(mine.filter(l => l.status === 'claimed').reduce((a, l) => a + l.price, 0))}</b></div></div><div style=${{ height: 6 }}></div></div>`;
    }
    case 'handoff': return html`<div className="fx"><div className="bd" style=${{ flexDirection: 'row', alignItems: 'center', gap: 12, paddingBottom: 14 }}>
        <div className="av" style=${{ width: 48, height: 48, background: '#ffd66b', fontWeight: 700 }}>สช</div>
        <div style=${{ flex: 1 }}><div style=${{ fontWeight: 700 }}>คุณสมชาย</div><div style=${{ fontSize: 12.5, color: '#888' }}>เจ้าหน้าที่ตลาด · ตอบภายใน ~5 นาที</div><div style=${{ fontSize: 12, color: '#0a8a3e', fontWeight: 600, marginTop: 2 }}>● ออนไลน์</div></div></div></div>`;
    case 'claimed-v': {
      const l = L(c.lid); if (!l) return null;
      return html`<div className="fx"><${Head} bg=${G.green} i="bag">มีคนกดรับแล้ว<//>
        <div className="bd"><div className="ttl" style=${{ fontSize: 15 }}>${l.name} ${l.qty} ${l.unit} · ฿${l.price}</div><div style=${{ fontSize: 13, color: '#555' }}>${l.buyer} จะมารับที่แผง ${l.stall} ภายใน 30 นาที ให้ลูกค้าแสดงรหัสนี้</div><div className="code" style=${{ padding: '6px 0 10px' }}>${l.code}</div></div></div>`;
    }
    case 'claimed-b': {
      const l = L(c.lid); if (!l) return null; const due = (l.claimedAt || now) + 30 * MIN;
      return html`<div className="fx"><${Hero} kind=${l.kind} color=${l.color} h=${92}><span className="tag">รับของได้ที่แผง ${l.stall}</span><div className="ringpos"><${Ring} rem=${due - now} total=${30 * MIN} size=${44} /></div><//>
        <div className="bd" style=${{ alignItems: 'center', textAlign: 'center' }}><div className="ttl">${l.name} ${l.qty} ${l.unit} · ${l.price ? '฿' + l.price : 'ฟรี'}</div><${QR} seed=${l.code} size=${104} /><div className="code">${l.code}</div>
        <div style=${{ fontSize: 12.5, color: '#888' }}>แสดงรหัสกับ${l.shop} ภายใน ${hm(due)} · จ่ายที่แผง</div></div><div style=${{ height: 8 }}></div></div>`;
    }
    case 'myclaims': {
      const mine = s.listings.filter(l => l.buyer === ME[role].name);
      return html`<div className="fx"><${Head} bg=${G.dark} i="bag">ที่ฉันรับแล้ว<//>

    case 'job': {
      const j = s.jobs.find(z => z.id === c.jid); if (!j) return null;

        ${j.status === 'done' ? html`<div style=${{ height: 8 }}></div>` : html`<${Btns} m=${m} role=${role} items=${[{ label: 'สแกนรับเลย', a: 'scan-open', arg: j.id, cls: 'p', i: 'qr', keep: true }]} />`}</div>`;

// สูตรตามสไลด์ Low Carbon: kgCO2e = kg×EF ฝังกลบ + LPG×EF LPG + kWh×EF ไฟ − (ไฟระบบ + มีเทนรั่ว)
function carbon(kgAll, kgBio, a) {
  const m3 = kgBio * a.yield; const lpg = m3 * 0.5 * 0.45; const kwh = m3 * 0.5 * 1.6;
  const landfill = kgAll * a.efLf, gas = lpg * a.efLpg, power = kwh * a.efGrid;
  const minus = kgBio * 0.05 * a.efGrid + m3 * 0.6 * 0.72 * (a.leak / 100) * 28;
  return { m3, lpg, kwh, landfill, gas, power, minus, total: landfill + gas + power - minus };
}

    <div className="grid2">
      <div className="panel"><h3>แผงที่ใช้ระบบมากที่สุด</h3><p className="sub">14 วันล่าสุด</p><div className="tbl"><table><thead><tr><th>แผง</th><th className="n">ลงของ</th><th>ขายทันเวลา</th><th className="n">เกรด A</th><th className="n">เครดิตที่ใช้</th></tr></thead>
        <tbody>${SHOPS.map(([n, st, items, ot, ga, cr]) => html`<tr key=${st}><td><b>${n}</b> <span style=${{ color: 'var(--muted)' }}>${st}</span></td><td className="n">${items + (st === ME.vendor.stall ? dm.listed : 0)}</td>
          <td><div style=${{ display: 'flex', alignItems: 'center', gap: 8 }}><div className="bar-in" style=${{ flex: 1 }}><i style=${{ width: ot + '%' }}></i></div><span className="num" style=${{ fontSize: 12.5 }}>${ot}%</span></div></td><td className="n">${ga}%</td><td className="n">${cr + (st === ME.vendor.stall ? dm.creditUsed : 0)}</td></tr>`)}</tbody></table></div></div>
      <div className="panel"><h3>รายงานคาร์บอน (สูตรตามสไลด์ Low Carbon)</h3><p className="sub">14 วันล่าสุด · ปรับสมมติฐานได้</p>
        <div className="calc">
          ${[['เศษไม่ลงฝังกลบ × EF ฝังกลบ', co.landfill, '+'], [`LPG ที่ร้านไม่ต้องซื้อ ${nf(co.lpg, 1)} กก. × EF LPG`, co.gas, '+'], [`ไฟหลวงที่แทนด้วยไบโอแก๊ส ${nf(co.kwh)} kWh`, co.power, '+'], ['ไฟระบบ + มีเทนรั่ว', co.minus, '−']].map(([t, v, sg]) => html`<div key=${t} className="it"><span>${t}</span><b className="num">${sg}${nf(v)}</b></div>`)}
          <div className="it tot"><span>kgCO₂e ที่ลด · คาดการณ์ 30 วัน ${nf(co.total * k30 / 1000, 2)} tCO₂e</span><b className="num">${nf(co.total)}</b></div></div>
        <div className="assume" style=${{ marginTop: 14 }}>
          ${[['rate', 'ค่ากำจัดขยะ (บาท/ตัน)', 50], ['efLf', 'EF ฝังกลบ (kgCO₂e/กก)', .05], ['efLpg', 'EF LPG (kgCO₂e/กก)', .1], ['efGrid', 'EF ไฟฟ้า (kgCO₂e/kWh)', .01], ['yield', 'ไบโอแก๊ส (m³/กก เศษ)', .01], ['leak', 'มีเทนรั่ว (%)', 1]].map(([k, t, st]) => html`<label key=${k} htmlFor=${'as-' + k}>${t}<input id=${'as-' + k} type="number" value=${a[k]} min="0" step=${st} onChange=${setK(k)} /></label>`)}</div>
        <p className="sub" style=${{ marginTop: 10, marginBottom: 0 }}>ทุกค่าเป็นค่าตั้งต้นตัวอย่าง ค่า EF ควรใช้ของ อบก. และอัตราไบโอแก๊สใช้ผล BMP test ของเศษจริงก่อนส่งรายงาน</p></div>
    </div></div>`;
}

/* ======================= app ======================= */
const ROLES = [['vendor', 'แม่ค้า', 'store'], ['buyer', 'ผู้ซื้อ', 'bag'], ['processor', 'แปรรูป', 'pot'], ['porter', 'คนขน', 'truck']];
const SHOT_CAP = { vendor: '01 · ต้นทางลงของ', buyer: '02 · ผู้ซื้อกดรับ', processor: '03 · หมดเวลา → ส่งต่อ', porter: 'Cold Loop · คนขนรับเศษ' };
function App() {
  const [s, d] = useReducer((st, f) => f(st), null, initState);
  const ref = useRef(s); ref.current = s; D = d; GET = () => ref.current;
  useEffect(() => { const t = setInterval(() => d(tick), 1000); return () => clearInterval(t); }, []);
  const setRole = r => d(x => ({ ...x, role: r, unread: { ...x.unread, [r]: 0 } }));
  const roleTabs = html`<div className="seg" role="group" aria-label="บทบาท">${ROLES.map(([k, t, i]) => html`<button key=${k} aria-pressed=${s.role === k} onClick=${() => setRole(k)}><${Icon} n=${i} s=${16} />${t}${s.unread[k] > 0 && s.role !== k && html`<span className="badge">${s.unread[k]}</span>`}</button>`)}</div>`;
  const view = v => d(x => ({ ...x, view: v }));
  return html`<${React.Fragment}>
    <header className="top"><div className="brand"><${Logo} s=${38} /><div><b>${BRAND.th} · ${BRAND.name}</b><small>ต้นแบบ LINE OA + LIFF + Dashboard · ข้อมูลตัวอย่าง</small></div></div>
      <div className="seg" role="group" aria-label="มุมมอง"><button aria-pressed=${s.view === 'phone'} onClick=${() => view('phone')}><${Icon} n="phone" s=${16} /><span className="lg">หน้างาน (LINE)</span><span className="sm">LINE</span></button>
        <button aria-pressed=${s.view === 'shot'} onClick=${() => view('shot')} aria-label="แคปจอใส่สไลด์"><${Icon} n="frame" s=${16} /><span className="lg">แคปจอใส่สไลด์</span></button>
        <button aria-pressed=${s.view === 'dash'} onClick=${() => view('dash')} aria-label="Dashboard"><${Icon} n="chart" s=${16} /><span className="lg">Dashboard</span></button></div></header>
    ${s.view === 'phone' ? html`<main className="stage"><${Guide} s=${s} /><div className="center">${roleTabs}<${Phone} s=${s} /></div><${Log} s=${s} /></main>`
      : s.view === 'shot' ? html`<main className="shot">${roleTabs}<${Phone} s=${s} /><div className="cap">${SHOT_CAP[s.role]}<span className="lg"> · ใช้ Win+Shift+S ครอบเฉพาะตัวเครื่อง</span></div></main>`
      : html`<${Dashboard} s=${s} />`}
    ${s.toast && html`<div className="toast" role="status">${s.toast}</div>`}<//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
