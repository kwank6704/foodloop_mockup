<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop lard 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Single light look on purpose: matches the Loop lard slide so recordings drop straight into the deck */
:root{
  --bg:#ececec; --ink:#1c1c1c; --muted:#5d5d5d; --green:#4a9440; --blue:#4a7fd4; --orange:#d08a3c; --rust:#b5532f;
  --f-d:"Anuphan","Noto Sans Thai",system-ui,sans-serif; --f-b:"Noto Sans Thai",system-ui,sans-serif; --k:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-b);overflow:hidden}
#app{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#f6f6f4,#e6e6e3 75%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none}
.nl,.el,.ml{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;will-change:transform}
.nl b{display:block;font:700 calc(17px*var(--k))/1.2 var(--f-d)}
.nl span{display:block;font:500 calc(11.5px*var(--k))/1.3 var(--f-b);color:var(--muted);margin-top:3px}
.nl.fill b,.nl.fill span{color:#fff}
.nl{transition:opacity .4s}
.nl.dim{opacity:.55}
.el{font:700 calc(13px*var(--k))/1.2 var(--f-d);padding:3px 9px;border-radius:999px;background:rgba(236,236,236,.85);transition:opacity .4s}
.el.dim{opacity:.5}
.ml{font:700 calc(11.5px*var(--k))/1 var(--f-d);letter-spacing:.04em}
.hd{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:max(18px,env(safe-area-inset-top,0px));pointer-events:none}
.hd h1{margin:0;font:700 clamp(40px,7vw,92px)/0.95 var(--f-d);color:var(--green);letter-spacing:-.02em}
.hd p{margin:8px 0 0;font:700 clamp(15px,2.1vw,26px)/1.3 var(--f-d);color:#2b2b2b}
.cap{position:absolute;left:50%;bottom:max(64px,calc(env(safe-area-inset-bottom,0px) + 64px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 18px;box-shadow:0 10px 30px -14px rgba(0,0,0,.35);max-width:min(760px,calc(100% - 32px));font:600 clamp(14px,1.6vw,17px)/1.45 var(--f-d)}
.cap .k{flex:none;font:700 13px var(--f-d);color:#fff;background:var(--green);border-radius:9px;padding:5px 9px}
.cap .t{animation:in .45s ease}
.dots{position:absolute;left:50%;bottom:max(40px,calc(env(safe-area-inset-bottom,0px) + 40px));transform:translateX(-50%);display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#c8c8c4;cursor:pointer}
.dots button[aria-current="true"]{background:var(--green);width:22px;border-radius:5px}
.ctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.ctl button,.ctl a{border:1px solid #d6d6d2;background:rgba(255,255,255,.92);border-radius:11px;padding:8px 12px;font:600 13.5px var(--f-d);color:#222;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.ctl button:hover,.ctl a:hover{border-color:var(--green)}
.ctl button:focus-visible,.dots button:focus-visible,.ctl a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.rule{position:absolute;left:max(24px,env(safe-area-inset-left,0px));right:24px;bottom:max(12px,env(safe-area-inset-bottom,0px));font:500 clamp(11.5px,1.3vw,15px)/1.4 var(--f-b);color:#333;pointer-events:none}
.hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));font:500 12px var(--f-b);color:#888}
.nogl{position:absolute;inset:0;display:grid;place-items:center;font:600 16px var(--f-d);color:#555;text-align:center;padding:24px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:700px){ .hint{display:none} .rule{bottom:max(8px,env(safe-area-inset-bottom,0px));font-size:11px} .cap{bottom:76px} .dots{bottom:58px} .ctl{top:auto;bottom:auto;top:max(110px,calc(env(safe-area-inset-top,0px) + 110px));right:12px} .ctl .lb{display:none} }
@media (prefers-reduced-motion: reduce){ .cap .t{animation:none} }
.rot{display:none;position:absolute;left:50%;top:63%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:8px 14px;font:600 13px var(--f-d);color:#333;box-shadow:0 6px 18px -10px rgba(0,0,0,.4);white-space:nowrap}
@media (orientation:portrait) and (max-width:700px){ .nl span{display:none} .el{font-size:10px;padding:2px 6px} .ml{display:none} .rot{display:block} }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="แผนภาพ 3 มิติของวงจร Loop lard"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <header class="hd"><h1>Loop lard</h1><p>เศษผักวันนี้ = ความเย็นที่ยืดอายุผักพรุ่งนี้</p></header>
  <div class="ctl">
    <button id="prev" aria-label="ขั้นก่อนหน้า">◀<span class="lb"> ก่อนหน้า</span></button>
    <button id="play" aria-label="เล่นหรือหยุด">⏸<span class="lb"> หยุด</span></button>
    <button id="next" aria-label="ขั้นถัดไป"><span class="lb">ถัดไป </span>▶</button>
    <button id="full" aria-label="เต็มจอ">⛶<span class="lb"> เต็มจอ</span></button>
    <a href="line-oa-prototype.html" aria-label="กลับไปหน้าต้นแบบ LINE">↩<span class="lb"> ต้นแบบ LINE</span></a>
  </div>
  <div class="cap" role="status" aria-live="polite"><span class="k" id="capk">01/09</span><span class="t" id="capt"></span></div>
  <div class="dots" id="dots"></div>
  <div class="rot" aria-hidden="true">หมุนโทรศัพท์เป็นแนวนอนเพื่อดูชัดขึ้น ⟳</div>
  <div class="rule">กติกา: เศษเกรด A [X] กก. = ฝาก 1 ลัง/คืน (ตั้งจากผล pilot) · เกรด C ไม่ได้เครดิต · เครดิตหมดอายุใน 30 วัน</div>
  <div class="hint">Space เล่น/หยุด · ← → เปลี่ยนขั้น</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const app = document.getElementById('app'), cv = document.getElementById('c'), labelsEl = document.getElementById('labels');
  if (!window.THREE) { app.insertAdjacentHTML('beforeend', '<div class="nogl">โหลดไลบรารี 3D ไม่ได้ ลองเชื่อมต่ออินเทอร์เน็ตแล้วเปิดใหม่</div>'); return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true }); }
  catch (e) { app.insertAdjacentHTML('beforeend', '<div class="nogl">เบราว์เซอร์นี้ยังไม่รองรับภาพ 3 มิติ (WebGL)</div>'); return; }
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd4cc, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(6, 14, 9); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 12, bottom: -12, near: 1, far: 40 }); sun.shadow.radius = 4;
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.ShadowMaterial({ opacity: 0.12 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  /* ---------- data: same layout as the Loop lard slide ---------- */
  const W = 3.3, DP = 1.5, H = 0.3, R = 0.28;
  const NODES = [
    { id: 'v', x: -6.3, z: -2, t: 'แม่ค้าแยกเศษ', s: 'ถังเขียว + QR ประจำร้าน', c: '#4a9440', bg: '#ffffff', icon: 'bin' },
    { id: 'p', x: -2.1, z: -2, t: 'คนขนชั่งน้ำหนัก', s: 'ให้เกรด A–C · เครดิตเข้า LINE', c: '#4a9440', bg: '#ffffff', icon: 'scale' },
    { id: 'd', x: 2.1, z: -2, t: 'บ่อหมักไบโอแก๊ส', s: 'ในพื้นที่ตลาด', c: '#4a9440', bg: '#ffffff', icon: 'dome' },
    { id: 'b', x: 6.3, z: -2, t: 'ไบโอแก๊ส', s: 'หุงต้ม + ปั่นไฟ', c: '#3f8a37', bg: '#4a9440', fill: true, icon: 'flame' },
    { id: 'c', x: -2.1, z: 2.2, t: 'ห้องเย็นรวม', s: 'ฝากผักที่เหลือข้ามคืน', c: '#4a7fd4', bg: '#eaf1fb', icon: 'cold', mod: 'MODULE 1' },
    { id: 'f', x: 2.1, z: 2.2, t: 'ปุ๋ยจากกาก', s: 'ขายให้เกษตรกร', c: '#d08a3c', bg: '#fbf3e7', icon: 'sack', mod: 'MODULE 2' },
    { id: 'r', x: 6.3, z: 2.2, t: 'ร้านอาหารในตลาด', s: 'ใช้แทน LPG', c: '#b5532f', bg: '#f8ece5', icon: 'pot', mod: 'MODULE 3' },
  ];
  const EDGES = [
    { id: 'e1', pts: [[-4.6, -2], [-3.8, -2]], c: '#4a9440' },
    { id: 'e2', pts: [[-0.4, -2], [0.4, -2]], c: '#4a9440' },
    { id: 'e3', pts: [[3.8, -2], [4.6, -2]], c: '#4a9440' },
    { id: 'e4', pts: [[2.1, -1.2], [2.1, 1.4]], c: '#d08a3c', label: 'กาก', lp: [2.75, 0.1] },
    { id: 'e5', pts: [[6.3, -1.2], [6.3, 1.4]], c: '#b5532f', label: 'แก๊สหุงต้ม', lp: [7.25, 0.1] },
    { id: 'e6', pts: [[7.95, -2], [8.9, -2], [8.9, 4.1], [-2.1, 4.1], [-2.1, 3.0]], c: '#4a7fd4', label: '⚡ ไฟจากไบโอแก๊ส → เดินห้องเย็น', lp: [3.4, 4.65] },
    { id: 'e7', pts: [[-3.75, 2.2], [-6.3, 2.2], [-6.3, -1.2]], c: '#4a7fd4', label: '↻ เครดิตฝากฟรี กลับสู่แม่ค้า', lp: [-4.6, 0.55] },
  ];
  const STEPS = [
    { n: ['v'], e: [], t: 'แม่ค้าแยกเศษผักผลไม้ใส่ถังเขียวที่มี QR ประจำร้าน' },
    { n: ['p'], e: ['e1'], t: 'ถังเต็ม คนขนสแกน QR ชั่งน้ำหนัก ให้เกรด A–C แต้มเข้า LINE ของแม่ค้าทันที' },
    { n: ['d'], e: ['e2'], t: 'เศษเกรด A/B เข้าบ่อหมักไบโอแก๊สในพื้นที่ตลาด ไม่ต้องขนออกไปฝังกลบ' },
    { n: ['b'], e: ['e3'], t: 'บ่อหมักผลิตไบโอแก๊ส ใช้ได้ทั้งหุงต้มและปั่นไฟ' },
    { n: ['f'], e: ['e4'], t: 'Module 2 · กากจากบ่อหมักทำเป็นปุ๋ย ขายให้เกษตรกร' },
    { n: ['r'], e: ['e5'], t: 'Module 3 · ต่อแก๊สหุงต้มให้ร้านอาหารในตลาด ใช้แทน LPG' },
    { n: ['c'], e: ['e6'], t: 'Module 1 · ไฟจากไบโอแก๊สเดินห้องเย็นรวม แม่ค้าฝากผักที่เหลือข้ามคืน' },
    { n: ['v'], e: ['e7'], t: 'เครดิตฝากฟรีกลับสู่แม่ค้า ผักยังสด ขายต่อได้อีกวัน' },
    { all: true, t: 'ครบวงจร ทุกอย่างจบในตลาด ไม่ต้องขนเศษออกไปจัดการที่อื่น' },
  ];
  const STEP_S = 2.8, ALL_S = 4.5;

  /* ---------- builders ---------- */
  const col = h => new THREE.Color(h);
  function rrPath(w, d, r, P) { const x = -w / 2, y = -d / 2; P.moveTo(x + r, y); P.lineTo(x + w - r, y); P.quadraticCurveTo(x + w, y, x + w, y + r); P.lineTo(x + w, y + d - r);
    P.quadraticCurveTo(x + w, y + d, x + w - r, y + d); P.lineTo(x + r, y + d); P.quadraticCurveTo(x, y + d, x, y + d - r); P.lineTo(x, y + r); P.quadraticCurveTo(x, y, x + r, y); return P; }
  function slab(shape, h) { const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2, curveSegments: 10 }); g.rotateX(-Math.PI / 2); return g; }
  const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: col(c), roughness: 0.55, metalness: 0.02 }, o));

  const nodeObj = {};
  NODES.forEach(n => {
    const g = new THREE.Group(); g.position.set(n.x, 0, n.z);
    const ring = rrPath(W, DP, R, new THREE.Shape()); ring.holes.push(rrPath(W - 0.12, DP - 0.12, R - 0.05, new THREE.Path()));
    const ringMat = std(n.c, { emissive: col(n.c), emissiveIntensity: 0 });
    const ringMesh = new THREE.Mesh(slab(ring, H + 0.04), ringMat); ringMesh.castShadow = true; g.add(ringMesh);
    const body = new THREE.Mesh(slab(rrPath(W - 0.1, DP - 0.1, R - 0.04, new THREE.Shape()), H), std(n.bg, { emissive: col(n.fill ? '#4a9440' : '#ffffff'), emissiveIntensity: 0 }));
    body.castShadow = true; body.receiveShadow = true; g.add(body);
    const icon = makeIcon(n.icon); icon.position.set(-1.28, H + 0.04, 0); g.add(icon);
    scene.add(g);
    const el = document.createElement('div'); el.className = 'nl' + (n.fill ? ' fill' : ''); el.innerHTML = `<b>${n.t}</b><span>${n.s}</span>`; labelsEl.appendChild(el);
    let ml = null; if (n.mod) { ml = document.createElement('div'); ml.className = 'ml'; ml.style.color = n.c; ml.textContent = n.mod; labelsEl.appendChild(ml); }
    nodeObj[n.id] = { n, g, ringMat, body, icon, el, ml, glow: 0, lift: 0 };
  });

  function makeIcon(kind) {
    const g = new THREE.Group(); const m = (geo, c, y = 0, x = 0, z = 0) => { const o = new THREE.Mesh(geo, std(c)); o.position.set(x, y, z); o.castShadow = true; g.add(o); return o; };
    if (kind === 'bin') { m(new THREE.BoxGeometry(0.38, 0.46, 0.38), '#13b85a', 0.23); m(new THREE.BoxGeometry(0.44, 0.06, 0.44), '#0a8f44', 0.49); m(new THREE.BoxGeometry(0.16, 0.16, 0.01), '#ffffff', 0.25, 0, 0.196); }
    else if (kind === 'scale') { m(new THREE.CylinderGeometry(0.06, 0.06, 0.32, 12), '#7b8590', 0.16); m(new THREE.BoxGeometry(0.5, 0.05, 0.38), '#9aa4ae', 0.34); m(new THREE.BoxGeometry(0.3, 0.22, 0.24), '#13b85a', 0.48); }
    else if (kind === 'dome') { m(new THREE.CylinderGeometry(0.36, 0.38, 0.14, 24), '#8a7a5c', 0.07); m(new THREE.SphereGeometry(0.34, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), '#5f8f5a', 0.14); }
    else if (kind === 'flame') { m(new THREE.ConeGeometry(0.2, 0.5, 18), '#ff8a1f', 0.25); m(new THREE.ConeGeometry(0.1, 0.28, 14), '#ffd34d', 0.16, 0, 0.06); }
    else if (kind === 'cold') { m(new THREE.BoxGeometry(0.5, 0.4, 0.42), '#d6e8fb', 0.2); m(new THREE.BoxGeometry(0.16, 0.3, 0.01), '#4a7fd4', 0.17, 0.08, 0.215); }
    else if (kind === 'sack') { [[-0.12, 0], [0.14, 0.03], [0.01, 0.2]].forEach(([x, y], i) => m(new THREE.BoxGeometry(0.26, 0.2, 0.22), '#b9874a', 0.1 + y, x, i === 2 ? 0 : 0.02)); }
    else if (kind === 'pot') { m(new THREE.CylinderGeometry(0.24, 0.2, 0.24, 24), '#3d4148', 0.12); m(new THREE.ConeGeometry(0.1, 0.22, 12), '#ff8a1f', 0.36); }
    return g;
  }

  const edgeObj = {};
  EDGES.forEach(e => {
    const path = new THREE.CurvePath(); const y = 0.16;
    for (let i = 1; i < e.pts.length; i++) path.add(new THREE.LineCurve3(new THREE.Vector3(e.pts[i - 1][0], y, e.pts[i - 1][1]), new THREE.Vector3(e.pts[i][0], y, e.pts[i][1])));
    const segs = Math.max(20, e.pts.length * 30);
    const tubeMat = std(e.c, { transparent: true, opacity: 0.35, emissive: col(e.c), emissiveIntensity: 0 });
    const tube = new THREE.Mesh(new THREE.TubeGeometry(path, segs, 0.055, 8, false), tubeMat); tube.castShadow = true; scene.add(tube);
    const a = e.pts[e.pts.length - 2], b = e.pts[e.pts.length - 1]; const dir = new THREE.Vector3(b[0] - a[0], 0, b[1] - a[1]).normalize();
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.32, 16), tubeMat); cone.position.set(b[0] - dir.x * 0.05, y, b[1] - dir.z * 0.05);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); scene.add(cone);
    const len = path.getLength(); const n = Math.max(3, Math.round(len * 1.6));
    const dots = []; const dm = new THREE.MeshBasicMaterial({ color: col(e.c), transparent: true, opacity: 0 });
    for (let i = 0; i < n; i++) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.095, 12, 8), dm); scene.add(d); dots.push(d); }
    let el = null; if (e.label) { el = document.createElement('div'); el.className = 'el'; el.style.color = e.c; el.textContent = e.label; labelsEl.appendChild(el); }
    edgeObj[e.id] = { e, path, len, tubeMat, dm, dots, el, glow: 0 };
  });

  /* ---------- camera + interaction ---------- */
  const target = new THREE.Vector3(1.1, 0, 0.9);
  const cam = { az: 0, el: 0.92, zoom: 1 }; // มุมกล้องคงที่ ตัวโหนดขยับแทน

  function resize() {
    const w = app.clientWidth, h = app.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    document.documentElement.style.setProperty('--k', Math.max(0.62, Math.min(1.15, w / 1400)).toFixed(3));
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- playback ---------- */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, step = reduce ? STEPS.length - 1 : 0, stepT = 0, clock = 0;
  const capk = document.getElementById('capk'), capt = document.getElementById('capt'), dotsEl = document.getElementById('dots'), playBtn = document.getElementById('play');
  STEPS.forEach((_, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', 'ไปขั้นที่ ' + (i + 1)); b.onclick = () => go(i); dotsEl.appendChild(b); });
  function showStep() {
    capk.textContent = String(step + 1).padStart(2, '0') + '/' + String(STEPS.length).padStart(2, '0');
    capt.textContent = STEPS[step].t; capt.style.animation = 'none'; void capt.offsetWidth; capt.style.animation = '';
    [...dotsEl.children].forEach((b, i) => b.setAttribute('aria-current', i === step ? 'true' : 'false'));
  }
  function go(i) { step = (i + STEPS.length) % STEPS.length; stepT = 0; showStep(); }
  function setPlay(p) { playing = p; playBtn.innerHTML = p ? '⏸<span class="lb"> หยุด</span>' : '▶<span class="lb"> เล่น</span>'; }
  playBtn.onclick = () => setPlay(!playing);
  document.getElementById('prev').onclick = () => go(step - 1);
  document.getElementById('next').onclick = () => go(step + 1);
  document.getElementById('full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else app.requestFullscreen?.().catch(() => {}); };
  window.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); setPlay(!playing); } if (e.key === 'ArrowRight') go(step + 1); if (e.key === 'ArrowLeft') go(step - 1); });
  setPlay(playing); showStep();

  // which nodes/edges have been reached so far in this round (earlier steps stay softly lit)
  function litSets() {
    const s = STEPS[step]; const nodes = new Set(), edges = new Set(), act = new Set(), actE = new Set();
    if (s.all) { NODES.forEach(n => { nodes.add(n.id); act.add(n.id); }); EDGES.forEach(e => { edges.add(e.id); actE.add(e.id); }); return { nodes, edges, act, actE }; }
    for (let i = 0; i <= step; i++) { STEPS[i].n.forEach(x => nodes.add(x)); STEPS[i].e.forEach(x => edges.add(x)); }
    s.n.forEach(x => act.add(x)); s.e.forEach(x => actE.add(x)); return { nodes, edges, act, actE };
  }

  const v3 = new THREE.Vector3();
  function place(el, x, y, z) { v3.set(x, y, z).project(camera); const w = app.clientWidth, h = app.clientHeight;
    el.style.transform = `translate(-50%,-50%) translate(${((v3.x + 1) / 2 * w).toFixed(1)}px,${((1 - v3.y) / 2 * h).toFixed(1)}px)`; }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame); // schedule first so one bad frame can't stop the animation
    const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
    if (playing) { stepT += dt; if (stepT > (STEPS[step].all ? ALL_S : STEP_S)) go(step + 1); }
    // camera: fixed angle, only the distance adapts to the screen shape
    const aspect = camera.aspect; const dist = Math.max(19, 11.2 / (Math.tan(THREE.MathUtils.degToRad(17.5)) * aspect)) * cam.zoom;
    camera.position.set(target.x + dist * Math.cos(cam.el) * Math.sin(cam.az), target.y + dist * Math.sin(cam.el), target.z + dist * Math.cos(cam.el) * Math.cos(cam.az));
    camera.lookAt(target);

    const { nodes, edges, act, actE } = litSets();
    Object.values(nodeObj).forEach(o => {
      const on = act.has(o.n.id), seen = nodes.has(o.n.id);
      o.glow += ((on ? 1 : 0) - o.glow) * 0.12; o.lift += ((on ? 0.22 : 0) - o.lift) * 0.12;
      o.g.position.y = o.lift + (on ? Math.sin(clock * 3) * 0.03 : 0);
      o.icon.rotation.y += dt * (on ? 1.4 : 0.15); o.icon.scale.setScalar(1 + o.glow * 0.25);
      o.ringMat.emissiveIntensity = o.glow * 0.55; o.body.material.emissiveIntensity = o.glow * (o.n.fill ? 0.25 : 0.06);
      o.el.classList.toggle('dim', !seen); place(o.el, o.n.x + 0.42, H + 0.1 + o.lift, o.n.z);
      if (o.ml) place(o.ml, o.n.x + 1.15, 0.05, o.n.z + 1.05);
    });
    Object.values(edgeObj).forEach(o => {
      const on = actE.has(o.e.id), seen = edges.has(o.e.id);
      o.glow += ((on ? 1 : seen ? 0.45 : 0) - o.glow) * 0.1;
      o.tubeMat.opacity = 0.3 + o.glow * 0.7; o.tubeMat.emissiveIntensity = (on ? 0.35 : 0) * o.glow;
      o.dm.opacity = on ? Math.min(1, o.glow * 1.2) : seen ? 0.25 : 0;
      // CurvePath.getPointAt can return null right at the ends, so keep u strictly inside (0,1)
      const speed = 1.6 / o.len; o.dots.forEach((d, i) => { const u = Math.min(0.999, Math.max(0.001, ((clock * speed) + i / o.dots.length) % 1)); const p = o.path.getPointAt(u);
        if (p) { d.position.copy(p); d.position.y += 0.02; } d.visible = !!p && o.dm.opacity > 0.02; });
      if (o.el) { o.el.classList.toggle('dim', !seen); place(o.el, o.e.lp[0], 0.2, o.e.lp[1]); }
    });
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
